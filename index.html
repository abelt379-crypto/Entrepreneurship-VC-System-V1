```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venture Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Custom Scrollbar for Dark Theme */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background-color: #020617; /* Very dark slate */
            color: #f8fafc; 
            overflow: hidden; 
        }

        /* Drag & Drop Styles */
        .dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }
        .drop-zone-active {
            background-color: rgba(99, 102, 241, 0.1) !important;
            border-color: rgba(99, 102, 241, 0.5) !important;
        }

        /* Wizard Animations */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Hide sidebar on mobile by default */
        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                z-index: 50;
                height: 100%;
                transform: translateX(-100%);
            }
            #sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body class="flex h-screen w-screen selection:bg-indigo-500/30">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col transition-transform duration-300 flex-shrink-0">
        <div class="p-4 flex items-center justify-between border-b border-slate-800">
            <h1 class="font-bold text-lg flex items-center gap-2 text-white">
                <i class="ph-fill ph-rocket-launch text-indigo-500"></i> Validator
            </h1>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>

        <div class="p-3">
            <button onclick="createNewVenture()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg px-4 py-2.5 text-sm font-medium transition-colors shadow-sm flex items-center justify-center gap-2">
                <i class="ph ph-plus-circle text-lg"></i> New Venture Chat
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-3 space-y-4" id="sidebar-folders">
            <!-- Folders will be injected here -->
        </div>

        <div class="p-4 border-t border-slate-800">
            <button onclick="createNewFolder()" class="w-full text-slate-400 hover:text-white text-sm flex items-center gap-2 px-2 py-1.5 rounded hover:bg-slate-800 transition-colors">
                <i class="ph ph-folder-plus"></i> Create Folder
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full bg-slate-950 overflow-hidden relative">
        <!-- Topbar -->
        <header class="h-14 border-b border-slate-800 flex items-center px-4 justify-between shrink-0 bg-slate-900/50 backdrop-blur-sm z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1 rounded hover:bg-slate-800 transition-colors">
                    <i class="ph ph-list text-2xl"></i>
                </button>
                <div id="breadcrumb" class="font-medium text-slate-200">Dashboard</div>
            </div>
            <div>
                <button onclick="goToHome()" class="text-slate-400 hover:text-white text-sm flex items-center gap-1.5 px-3 py-1.5 rounded-md hover:bg-slate-800 transition-colors">
                    <i class="ph ph-house"></i> Home
                </button>
            </div>
        </header>

        <!-- Dynamic View Container -->
        <div id="main-view" class="flex-1 overflow-hidden flex flex-col relative w-full">
            <!-- Content injected via JS -->
        </div>
    </main>

    <!-- Custom Modal -->
    <div id="app-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center">
        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative bg-slate-900 border border-slate-700 rounded-xl p-5 w-full max-w-sm shadow-2xl mx-4 transform transition-all scale-95 opacity-0" id="app-modal-content">
            <h3 id="app-modal-title" class="text-lg font-bold text-white mb-2">Title</h3>
            <p id="app-modal-message" class="text-sm text-slate-400 mb-4 hidden"></p>
            <input type="text" id="app-modal-input" class="w-full bg-slate-950 border border-slate-700 rounded py-2 px-3 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none transition-colors mb-5 hidden">
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors">Cancel</button>
                <button id="app-modal-confirm" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg shadow-sm transition-colors">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const generateId = (prefix) => prefix + '_' + Math.random().toString(36).substr(2, 9);
        
        let state = {
            sidebarOpen: true,
            currentView: 'home', // 'home' or 'wizard'
            activeVentureId: null,
            folders: [
                { id: 'f_apps', name: 'Software / Apps', color: 'bg-indigo-500' },
                { id: 'f_phys', name: 'Physical Products', color: 'bg-emerald-500' },
                { id: 'f_unassigned', name: 'Unassigned', color: 'bg-slate-500' }
            ],
            ventures: [
                {
                    id: 'v_example',
                    folderId: 'f_apps',
                    name: 'AI Waiter System',
                    status: 'idea', // idea, explored, validated
                    scopes: ['South Africa', 'US'], // Array of targeted regions/scopes
                    audience: 'Restaurant Owners',
                    outcome: 'Reduce order taking mistakes and labor costs',
                    classification: 'Inefficiency', // Want, Need, Inefficiency, Pain
                    context: 'During peak dinner rush hours',
                    frequency: 'Daily',
                    willingnessToPay: 'High',
                    abilityToPay: 'Moderate'
                }
            ]
        };

        // --- Core Render Functions ---
        
        function initApp() {
            renderSidebar();
            renderView();
            
            // Handle window resize for mobile sidebar
            window.addEventListener('resize', () => {
                const sidebar = document.getElementById('sidebar');
                if (window.innerWidth >= 768) {
                    sidebar.classList.remove('open');
                }
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth < 768) {
                sidebar.classList.toggle('open');
            } else {
                state.sidebarOpen = !state.sidebarOpen;
                sidebar.style.width = state.sidebarOpen ? '16rem' : '0px';
                sidebar.style.overflow = state.sidebarOpen ? 'visible' : 'hidden';
                sidebar.style.opacity = state.sidebarOpen ? '1' : '0';
                sidebar.style.padding = state.sidebarOpen ? '' : '0';
            }
        }

        function goToHome() {
            state.currentView = 'home';
            state.activeVentureId = null;
            document.getElementById('breadcrumb').innerHTML = 'Dashboard';
            renderView();
        }

        function openWizard(ventureId) {
            state.currentView = 'wizard';
            state.activeVentureId = ventureId;
            const venture = state.ventures.find(v => v.id === ventureId);
            document.getElementById('breadcrumb').innerHTML = `<span class="text-slate-500 cursor-pointer hover:text-slate-300" onclick="goToHome()">Dashboard</span> <span class="mx-2 text-slate-600">/</span> <span class="text-indigo-400">${venture.name}</span>`;
            renderView();
        }

        function renderView() {
            const container = document.getElementById('main-view');
            if (state.currentView === 'home') {
                container.innerHTML = getDashboardHTML();
                setupDragAndDrop();
            } else if (state.currentView === 'wizard') {
                container.innerHTML = getWizardHTML();
            }
            renderSidebar(); // Update active states in sidebar
        }

        // --- Sidebar Logic ---

        function toggleFolder(id) {
            const el = document.getElementById('folder-items-' + id);
            if (el) {
                el.classList.toggle('hidden');
            }
        }

        function createNewFolder() {
            openModal({
                title: 'Create Folder',
                showInput: true,
                inputPlaceholder: 'Enter new folder name...',
                onConfirm: (name) => {
                    if (name && name.trim()) {
                        const colors = ['bg-red-500', 'bg-orange-500', 'bg-yellow-500', 'bg-emerald-500', 'bg-cyan-500', 'bg-blue-500', 'bg-indigo-500', 'bg-purple-500', 'bg-pink-500'];
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        
                        // Add right above 'Unassigned' folder
                        const newFolder = { id: generateId('f'), name: name.trim(), color: color };
                        state.folders.splice(state.folders.length - 1, 0, newFolder);
                        renderSidebar();
                    }
                }
            });
        }

        function promptRenameFolder(id) {
            const f = state.folders.find(x => x.id === id);
            if (!f || f.id === 'f_unassigned') return;
            
            openModal({
                title: 'Rename Folder',
                showInput: true,
                initialValue: f.name,
                onConfirm: (newName) => {
                    if (newName && newName.trim()) {
                        f.name = newName.trim();
                        renderSidebar();
                        if(state.currentView === 'wizard') renderView(); // Update headers if open
                    }
                }
            });
        }

        function deleteFolder(id) {
            if (id === 'f_unassigned') return;
            
            openModal({
                title: 'Delete Folder',
                message: "Delete this folder? All ventures inside will be moved to the 'Unassigned' folder.",
                isDestructive: true,
                confirmText: 'Delete',
                onConfirm: () => {
                    // Move ventures to unassigned
                    state.ventures.forEach(v => {
                        if (v.folderId === id) {
                            v.folderId = 'f_unassigned';
                        }
                    });
                    // Remove folder
                    state.folders = state.folders.filter(f => f.id !== id);
                    renderSidebar();
                    if (state.currentView === 'wizard' || state.currentView === 'home') renderView();
                }
            });
        }

        function renderSidebar() {
            const container = document.getElementById('sidebar-folders');
            let html = '';

            state.folders.forEach(folder => {
                const folderVentures = state.ventures.filter(v => v.folderId === folder.id);
                html += `
                    <div class="mb-4 folder-dropzone" data-folder-id="${folder.id}">
                        <div class="flex items-center justify-between group px-2 py-1.5 rounded hover:bg-slate-800/50 cursor-pointer transition-colors" onclick="toggleFolder('${folder.id}')">
                            <div class="flex items-center gap-2 text-sm font-medium text-slate-300">
                                <div class="w-2.5 h-2.5 rounded-full ${folder.color}"></div>
                                <span class="truncate max-w-[100px]" title="${folder.name}">${folder.name}</span>
                            </div>
                            <div class="flex items-center">
                                <!-- Action Buttons on Hover -->
                                <div class="hidden group-hover:flex items-center gap-0.5 mr-1">
                                    ${folder.id !== 'f_unassigned' ? `
                                        <button onclick="promptRenameFolder('${folder.id}'); event.stopPropagation();" class="p-1 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors" title="Rename Folder">
                                            <i class="ph ph-pencil-simple"></i>
                                        </button>
                                        <button onclick="deleteFolder('${folder.id}'); event.stopPropagation();" class="p-1 text-slate-400 hover:text-red-400 hover:bg-slate-700 rounded transition-colors" title="Delete Folder">
                                            <i class="ph ph-trash"></i>
                                        </button>
                                    ` : ''}
                                </div>
                                <!-- Count Badge -->
                                <span class="text-xs text-slate-500 bg-slate-800 px-1.5 rounded group-hover:hidden">${folderVentures.length}</span>
                            </div>
                        </div>
                        <div class="mt-1 pl-4 space-y-0.5 transition-all" id="folder-items-${folder.id}">
                            ${folderVentures.map(v => `
                                <div onclick="openWizard('${v.id}')" 
                                     draggable="true" 
                                     data-venture-id="${v.id}"
                                     class="venture-drag-item group flex items-center justify-between gap-2 px-2 py-1.5 text-sm rounded-md cursor-pointer transition-colors ${state.activeVentureId === v.id ? 'bg-indigo-500/20 text-indigo-300' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}">
                                    <div class="flex items-center gap-2 truncate">
                                        <i class="ph ph-chat-circle text-slate-500 group-hover:text-indigo-400 ${state.activeVentureId === v.id ? 'text-indigo-400' : ''}"></i>
                                        <span class="truncate" title="${v.name}">${v.name}</span>
                                    </div>
                                    
                                    <!-- Venture Chat Action Buttons -->
                                    <div class="hidden group-hover:flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                                        <button onclick="promptRename('${v.id}'); event.stopPropagation();" class="p-1 text-slate-500 hover:text-white hover:bg-slate-700 rounded transition-colors" title="Rename Chat">
                                            <i class="ph ph-pencil-simple"></i>
                                        </button>
                                        <button onclick="deleteVenture('${v.id}'); event.stopPropagation();" class="p-1 text-slate-500 hover:text-red-400 hover:bg-slate-700 rounded transition-colors" title="Delete Chat">
                                            <i class="ph ph-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            setupSidebarDragAndDrop();
        }

        function createNewFolder() {
            const name = prompt('Enter new folder name:');
            if (name && name.trim()) {
                const colors = ['bg-red-500', 'bg-orange-500', 'bg-yellow-500', 'bg-emerald-500', 'bg-cyan-500', 'bg-blue-500', 'bg-indigo-500', 'bg-purple-500', 'bg-pink-500'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                // Add right above 'Unassigned' folder
                const newFolder = { id: generateId('f'), name: name.trim(), color: color };
                state.folders.splice(state.folders.length - 1, 0, newFolder);
                renderSidebar();
            }
        }

        function promptRenameFolder(id) {
            const f = state.folders.find(x => x.id === id);
            if (!f || f.id === 'f_unassigned') return;
            
            const newName = prompt("Rename folder:", f.name);
            if (newName && newName.trim()) {
                f.name = newName.trim();
                renderSidebar();
                if(state.currentView === 'wizard') renderView(); // Update headers if open
            }
        }

        function deleteFolder(id) {
            if (id === 'f_unassigned') return;
            
            if (confirm("Delete this folder? All ventures inside will be moved to the 'Unassigned' folder.")) {
                // Move ventures to unassigned
                state.ventures.forEach(v => {
                    if (v.folderId === id) {
                        v.folderId = 'f_unassigned';
                    }
                });
                // Remove folder
                state.folders = state.folders.filter(f => f.id !== id);
                renderSidebar();
                if (state.currentView === 'wizard' || state.currentView === 'home') renderView();
            }
        }

        // --- Dashboard / Kanban Logic ---

        function getDashboardHTML() {
            const columns = [
                { id: 'idea', title: 'Potential Ideas', icon: 'ph-lightbulb', color: 'text-amber-400', border: 'border-amber-500/30' },
                { id: 'explored', title: 'Explored Ventures', icon: 'ph-magnifying-glass', color: 'text-blue-400', border: 'border-blue-500/30' },
                { id: 'validated', title: 'Validated Problems', icon: 'ph-check-circle', color: 'text-emerald-400', border: 'border-emerald-500/30' }
            ];

            let html = `
                <div class="flex flex-col h-full w-full">
                    <div class="mb-4 shrink-0 px-4 md:px-6 pt-4 md:pt-6">
                        <h2 class="text-2xl font-bold text-white mb-1">Venture Pipeline</h2>
                        <p class="text-slate-400 text-sm">Capture ideas, explore solutions, and validate problems to build.</p>
                    </div>
                    <div class="flex-1 overflow-x-auto overflow-y-hidden">
                        <div class="flex gap-4 h-full px-4 md:px-6 pb-6 items-start snap-x snap-mandatory">
            `;

            columns.forEach(col => {
                const columnVentures = state.ventures.filter(v => v.status === col.id);
                
                let quickAddHTML = '';
                if (col.id === 'idea') {
                    quickAddHTML = `
                        <div class="px-3 pb-3 shrink-0">
                            <form onsubmit="quickAddIdea(event)" class="bg-slate-900/80 p-2.5 rounded-lg border border-slate-700 space-y-2 shadow-inner">
                                <input type="text" id="quick-idea-name" placeholder="Problem to solve..." class="w-full bg-slate-950 border border-slate-800 rounded py-1.5 px-3 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none transition-colors" required>
                                <div class="flex gap-2">
                                    <div class="relative flex-1">
                                        <i class="ph ph-users absolute left-2.5 top-[9px] text-slate-500"></i>
                                        <input type="text" id="quick-idea-audience" placeholder="For who? (e.g. Students)" class="w-full bg-slate-950 border border-slate-800 rounded py-1.5 pl-8 pr-3 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none transition-colors">
                                    </div>
                                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white rounded px-3 py-1.5 text-sm font-medium transition-colors shrink-0 flex items-center gap-1 shadow-sm">
                                        <i class="ph ph-plus"></i> Add
                                    </button>
                                </div>
                            </form>
                        </div>
                    `;
                }

                html += `
                    <div class="w-[85vw] sm:w-[340px] flex-shrink-0 flex flex-col h-full max-h-full bg-slate-900/60 border ${col.border} rounded-xl overflow-hidden kanban-col snap-center shadow-lg" data-status="${col.id}">
                        <div class="p-3 border-b border-slate-800/80 flex items-center justify-between bg-slate-800/40 shrink-0">
                            <h3 class="font-semibold flex items-center gap-2 text-slate-200">
                                <i class="ph ${col.icon} ${col.color} text-lg"></i>
                                ${col.title}
                            </h3>
                            <span class="bg-slate-800 border border-slate-700 text-slate-300 text-xs py-0.5 px-2.5 rounded-full font-medium shadow-inner">${columnVentures.length}</span>
                        </div>
                        ${quickAddHTML}
                        <div class="flex-1 overflow-y-auto p-3 space-y-3 dropzone">
                            ${columnVentures.map(v => getCardHTML(v)).join('')}
                            ${columnVentures.length === 0 ? `<div class="text-center text-slate-500 text-sm py-8 border-2 border-dashed border-slate-700/50 rounded-lg bg-slate-800/20">Drag items here</div>` : ''}
                        </div>
                    </div>
                `;
            });

            html += `
                        </div>
                    </div>
                </div>`;
            return html;
        }

        function getCardHTML(venture) {
            const scopeColors = { 
                'south africa': 'text-emerald-400 bg-emerald-400/10 border-emerald-500/20', 
                'us': 'text-blue-400 bg-blue-400/10 border-blue-500/20',
                'usa': 'text-blue-400 bg-blue-400/10 border-blue-500/20',
                'global': 'text-purple-400 bg-purple-400/10 border-purple-500/20'
            };
            
            const scopesHTML = (venture.scopes || []).map(s => {
                const key = s.trim().toLowerCase();
                const colorCls = scopeColors[key] || 'text-indigo-400 bg-indigo-400/10 border-indigo-500/20';
                const icon = key.includes('global') ? 'ph-globe' : (key.includes('africa') || key === 'us' || key === 'usa' ? 'ph-map-pin' : 'ph-tag');
                return `<span class="text-[10px] px-1.5 py-0.5 rounded flex items-center gap-1 font-medium border ${colorCls} shadow-sm"><i class="ph ${icon}"></i> ${s}</span>`;
            }).join('');

            return `
                <div draggable="true" data-venture-id="${venture.id}" class="kanban-card group bg-slate-800 hover:bg-slate-700 border border-slate-600 hover:border-slate-500 p-3.5 rounded-lg cursor-grab active:cursor-grabbing transition-all shadow-md relative touch-manipulation">
                    
                    <!-- Action Menu on hover (Desktop) / Always slightly visible on Mobile -->
                    <div class="absolute top-3 right-3 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity flex gap-1 bg-slate-800/90 rounded-md shadow-sm backdrop-blur-sm z-10">
                        <button onclick="promptRename('${venture.id}'); event.stopPropagation();" class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-600 rounded transition-colors" title="Rename"><i class="ph ph-pencil-simple"></i></button>
                        <button onclick="deleteVenture('${venture.id}'); event.stopPropagation();" class="p-1.5 text-slate-400 hover:text-red-400 hover:bg-slate-600 rounded transition-colors" title="Delete"><i class="ph ph-trash"></i></button>
                    </div>

                    <div class="pr-14" onclick="openWizard('${venture.id}')">
                        <h4 class="font-medium text-white mb-2.5 leading-snug">${venture.name}</h4>
                        
                        <div class="flex flex-wrap gap-1.5 mb-2.5">
                            ${scopesHTML}
                            <button onclick="editScopes('${venture.id}'); event.stopPropagation();" class="text-[10px] px-1.5 py-0.5 rounded flex items-center gap-1 font-medium border text-slate-400 bg-slate-800 border-slate-700 hover:bg-slate-700 transition-colors shadow-sm" title="Edit Scopes">
                                <i class="ph ph-plus"></i>
                            </button>
                            ${venture.audience ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 flex items-center gap-1 shadow-sm"><i class="ph ph-users"></i> ${venture.audience}</span>` : ''}
                            ${venture.classification ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 border border-slate-600 text-slate-300 shadow-sm">${venture.classification}</span>` : ''}
                        </div>
                        
                        <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">
                            ${venture.outcome || 'Click to add details and validate this venture...'}
                        </p>
                    </div>
                </div>
            `;
        }

        function quickAddIdea(e) {
            e.preventDefault();
            const nameInput = document.getElementById('quick-idea-name');
            const audInput = document.getElementById('quick-idea-audience');
            if (!nameInput.value.trim()) return;

            const newV = {
                id: generateId('v'),
                folderId: 'f_unassigned',
                name: nameInput.value.trim(),
                status: 'idea',
                scopes: ['South Africa'],
                audience: audInput.value.trim(),
                outcome: nameInput.value.trim(), // Pre-fill outcome
                classification: '', context: '', frequency: '', willingnessToPay: '', abilityToPay: ''
            };
            
            state.ventures.unshift(newV);
            renderView();
        }

        function createNewVenture() {
            openModal({
                title: 'New Venture',
                message: 'What is the core problem or idea?',
                showInput: true,
                inputPlaceholder: 'e.g. Too much time spent writing emails',
                onConfirm: (name) => {
                    if (name && name.trim()) {
                        const newV = {
                            id: generateId('v'),
                            folderId: 'f_unassigned',
                            name: name.trim(),
                            status: 'idea',
                            scopes: ['South Africa'],
                            audience: '', outcome: name.trim(), classification: '', context: '', frequency: '', willingnessToPay: '', abilityToPay: ''
                        };
                        state.ventures.unshift(newV);
                        openWizard(newV.id);
                    }
                }
            });
        }

        function promptRename(id) {
            const v = state.ventures.find(x => x.id === id);
            openModal({
                title: 'Rename Venture',
                showInput: true,
                initialValue: v.name,
                onConfirm: (newName) => {
                    if (newName && newName.trim()) {
                        v.name = newName.trim();
                        renderSidebar(); // Update sidebar name
                        renderView();    // Update board/wizard name
                    }
                }
            });
        }

        function deleteVenture(id) {
            openModal({
                title: 'Delete Venture',
                message: 'Delete this venture permanently?',
                isDestructive: true,
                confirmText: 'Delete',
                onConfirm: () => {
                    state.ventures = state.ventures.filter(v => v.id !== id);
                    renderSidebar();
                    if(state.activeVentureId === id) {
                        goToHome();
                    } else {
                        renderView();
                    }
                }
            });
        }

        function editScopes(id) {
            const v = state.ventures.find(x => x.id === id);
            openModal({
                title: 'Edit Target Locations',
                message: 'Enter target regions separated by commas (e.g. South Africa, US, Global)',
                showInput: true,
                initialValue: (v.scopes || []).join(', '),
                onConfirm: (val) => {
                    if (val !== null) {
                        v.scopes = val.split(',').map(s => s.trim()).filter(Boolean);
                        renderView();
                    }
                }
            });
        }

        // --- Drag and Drop implementation ---
        
        let draggedVentureId = null;

        function setupDragAndDrop() {
            const cards = document.querySelectorAll('.kanban-card');
            const columns = document.querySelectorAll('.kanban-col');

            cards.forEach(card => {
                card.addEventListener('dragstart', (e) => {
                    draggedVentureId = card.getAttribute('data-venture-id');
                    card.classList.add('dragging');
                });
                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    draggedVentureId = null;
                    columns.forEach(col => col.classList.remove('drop-zone-active'));
                });
            });

            columns.forEach(col => {
                col.addEventListener('dragover', e => {
                    e.preventDefault();
                    col.classList.add('drop-zone-active');
                });
                col.addEventListener('dragleave', () => {
                    col.classList.remove('drop-zone-active');
                });
                col.addEventListener('drop', e => {
                    e.preventDefault();
                    col.classList.remove('drop-zone-active');
                    if (draggedVentureId) {
                        const newStatus = col.getAttribute('data-status');
                        const venture = state.ventures.find(v => v.id === draggedVentureId);
                        if (venture && venture.status !== newStatus) {
                            venture.status = newStatus;
                            renderView();
                        }
                    }
                });
            });
        }

        function setupSidebarDragAndDrop() {
            const items = document.querySelectorAll('.venture-drag-item');
            const folders = document.querySelectorAll('.folder-dropzone');

            items.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    draggedVentureId = item.getAttribute('data-venture-id');
                    item.classList.add('opacity-50');
                });
                item.addEventListener('dragend', () => {
                    item.classList.remove('opacity-50');
                    draggedVentureId = null;
                    folders.forEach(f => f.classList.remove('bg-slate-800/50'));
                });
            });

            folders.forEach(folder => {
                folder.addEventListener('dragover', e => {
                    e.preventDefault();
                    folder.classList.add('bg-slate-800/50');
                });
                folder.addEventListener('dragleave', () => {
                    folder.classList.remove('bg-slate-800/50');
                });
                folder.addEventListener('drop', e => {
                    e.preventDefault();
                    folder.classList.remove('bg-slate-800/50');
                    if (draggedVentureId) {
                        const newFolderId = folder.getAttribute('data-folder-id');
                        const venture = state.ventures.find(v => v.id === draggedVentureId);
                        if (venture && venture.folderId !== newFolderId) {
                            venture.folderId = newFolderId;
                            renderSidebar();
                            if(state.currentView === 'home') renderView();
                        }
                    }
                });
            });
        }


        // --- Wizard / Detail View Logic ---

        function getWizardHTML() {
            const v = state.ventures.find(x => x.id === state.activeVentureId);
            if (!v) return '';

            return `
                <div class="p-4 md:p-6 h-full w-full overflow-y-auto">
                    <div class="max-w-4xl mx-auto fade-in pb-12">
                        <!-- Header -->
                        <div class="flex items-start justify-between mb-8 pb-4 border-b border-slate-800">
                            <div class="flex items-center gap-3 mb-2">
                                <h2 class="text-3xl font-bold text-white">${v.name}</h2>
                                <span class="bg-indigo-500/20 text-indigo-400 px-2.5 py-1 rounded text-xs font-semibold uppercase tracking-wider">${v.status}</span>
                            </div>
                            <p class="text-slate-400 flex items-center gap-4">
                                <span><i class="ph ph-folder text-slate-500"></i> ${state.folders.find(f=>f.id === v.folderId)?.name || 'Unassigned'}</span>
                                <span class="flex items-center gap-2">
                                    <i class="ph ph-globe text-slate-500"></i> 
                                    ${(v.scopes || []).map(s => `<span class="bg-slate-800 border border-slate-700 text-xs px-2 py-0.5 rounded shadow-sm">${s}</span>`).join('')}
                                    <button onclick="editScopes('${v.id}')" class="text-indigo-400 hover:text-indigo-300 text-sm ml-1" title="Edit Scopes"><i class="ph ph-pencil-simple"></i></button>
                                </span>
                            </p>
                        </div>
                        <button onclick="deleteVenture('${v.id}')" class="text-red-400 hover:bg-red-400/10 p-2 rounded-lg transition-colors">
                            <i class="ph ph-trash text-xl"></i>
                        </button>
                    </div>

                    <!-- Canvas Form -->
                    <div class="space-y-8">
                        
                        <!-- Problem & Classification -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="md:col-span-2 space-y-3">
                                <label class="block text-sm font-semibold text-slate-300">1) What outcome do people want or need?</label>
                                <textarea id="w-outcome" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-600" placeholder="Describe the end result they desire..." onchange="updateVentureField('outcome', this.value)">${v.outcome}</textarea>
                            </div>
                            
                            <div class="space-y-3">
                                <label class="block text-sm font-semibold text-slate-300">Classification</label>
                                <div class="grid grid-cols-2 gap-2">
                                    ${['Want', 'Need', 'Inefficiency', 'Pain'].map(type => `
                                        <button onclick="updateVentureField('classification', '${type}')" 
                                            class="py-2 px-3 rounded-lg border text-sm font-medium transition-all
                                            ${v.classification === type ? 'bg-indigo-600 border-indigo-500 text-white shadow-[0_0_15px_rgba(79,70,229,0.3)]' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}">
                                            ${type}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <hr class="border-slate-800">

                        <!-- Audience & Context -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-6">
                                <div class="space-y-3">
                                    <label class="block text-sm font-semibold text-slate-300">2) Who wants it? (Who are these people?)</label>
                                    <div class="relative">
                                        <i class="ph ph-users absolute left-3 top-[11px] text-slate-500 text-lg"></i>
                                        <input type="text" value="${v.audience}" onchange="updateVentureField('audience', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2.5 pl-10 pr-4 text-white focus:border-indigo-500 outline-none" placeholder="e.g. Remote Workers, Local Dentists">
                                    </div>
                                </div>
                                <div class="space-y-3">
                                    <label class="block text-sm font-semibold text-slate-300">3) In what context do they want it?</label>
                                    <textarea rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:border-indigo-500 outline-none placeholder:text-slate-600" placeholder="Where or when does this problem occur?" onchange="updateVentureField('context', this.value)">${v.context}</textarea>
                                </div>
                                <div class="space-y-3">
                                    <label class="block text-sm font-semibold text-slate-300">How often do they experience this context?</label>
                                    <select onchange="updateVentureField('frequency', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2.5 px-3 text-white focus:border-indigo-500 outline-none appearance-none">
                                        <option value="">Select frequency...</option>
                                        ${['Multiple times a day', 'Daily', 'Weekly', 'Monthly', 'Rarely but acutely'].map(opt => 
                                            `<option value="${opt}" ${v.frequency === opt ? 'selected' : ''}>${opt}</option>`
                                        ).join('')}
                                    </select>
                                </div>
                            </div>

                            <!-- Validation & Financials -->
                            <div class="space-y-6 bg-slate-900/50 p-5 rounded-xl border border-slate-800">
                                <h3 class="font-semibold text-slate-200 flex items-center gap-2 mb-4"><i class="ph ph-currency-circle-dollar text-emerald-400 text-xl"></i> Viability Check</h3>
                                
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-slate-400 mb-2">Are they WILLING to pay for it?</label>
                                        <div class="flex gap-2">
                                            ${['High', 'Moderate', 'Low', 'Unsure'].map(val => `
                                                <button onclick="updateVentureField('willingnessToPay', '${val}')" class="flex-1 py-1.5 border rounded text-xs font-medium ${v.willingnessToPay === val ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-600'}">${val}</button>
                                            `).join('')}
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-400 mb-2">Are they ABLE to pay for it? (Purchasing power)</label>
                                        <div class="flex gap-2">
                                            ${['High', 'Moderate', 'Low', 'Unsure'].map(val => `
                                                <button onclick="updateVentureField('abilityToPay', '${val}')" class="flex-1 py-1.5 border rounded text-xs font-medium ${v.abilityToPay === val ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-600'}">${val}</button>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>

                                <div class="pt-4 mt-6 border-t border-slate-800">
                                    <label class="block text-sm font-medium text-slate-400 mb-2">Move Pipeline Status</label>
                                    <div class="flex bg-slate-800 rounded-lg p-1">
                                        ${['idea', 'explored', 'validated'].map(status => `
                                            <button onclick="updateVentureField('status', '${status}')" class="flex-1 py-1.5 text-xs font-medium capitalize rounded-md transition-colors ${v.status === status ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}">${status}</button>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateVentureField(field, value) {
            const v = state.ventures.find(x => x.id === state.activeVentureId);
            if (v) {
                v[field] = value;
                renderView(); // Re-render to show active states
            }
        }

        // --- Custom Modal Logic ---
        let modalConfirmCallback = null;

        function openModal({ title, message, inputPlaceholder, initialValue, showInput, confirmText, isDestructive, onConfirm }) {
            const modal = document.getElementById('app-modal');
            const content = document.getElementById('app-modal-content');
            const titleEl = document.getElementById('app-modal-title');
            const msgEl = document.getElementById('app-modal-message');
            const inputEl = document.getElementById('app-modal-input');
            const confirmBtn = document.getElementById('app-modal-confirm');

            titleEl.textContent = title;
            
            if (message) { 
                msgEl.textContent = message; 
                msgEl.classList.remove('hidden'); 
            } else { 
                msgEl.classList.add('hidden'); 
            }

            if (showInput) {
                inputEl.placeholder = inputPlaceholder || '';
                inputEl.value = initialValue || '';
                inputEl.classList.remove('hidden');
            } else {
                inputEl.classList.add('hidden');
            }

            confirmBtn.textContent = confirmText || 'Confirm';
            if (isDestructive) {
                confirmBtn.className = 'px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-500 rounded-lg shadow-sm transition-colors';
            } else {
                confirmBtn.className = 'px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg shadow-sm transition-colors';
            }

            modalConfirmCallback = () => {
                const val = showInput ? inputEl.value : null;
                closeModal();
                onConfirm(val);
            };

            // Remove old event listeners
            const newConfirmBtn = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
            newConfirmBtn.addEventListener('click', modalConfirmCallback);
            
            // Handle Enter key for input
            inputEl.onkeydown = (e) => {
                if (e.key === 'Enter') modalConfirmCallback();
            };

            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
                if (showInput) inputEl.focus();
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('app-modal');
            const content = document.getElementById('app-modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modalConfirmCallback = null;
            }, 200);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
