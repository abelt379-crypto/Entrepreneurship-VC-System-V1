                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-app-secondary mb-1">Customer Dissatisfaction</label>
                            <textarea rows="2" onchange="updateNestedProblem('${p.id}', 'alternatives', 'dissatisfaction', this.value)"
                                placeholder="Why do current options fail them?" class="w-full rounded-xl p-3 text-xs">${esc(p.alternatives.dissatisfaction)}</textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-app-secondary mb-1">Switching Barriers</label>
                            <textarea rows="2" onchange="updateNestedProblem('${p.id}', 'alternatives', 'switchingBarriers', this.value)"
                                placeholder="Data migration, retraining staff, contracts, habit..." class="w-full rounded-xl p-3 text-xs">${esc(p.alternatives.switchingBarriers)}</textarea>
                        </div>
                    </div>
                `;
            }

            if (tab === 'evidence') {
                const records = db.evidence.filter(e => e.problemId === p.id);
                return `
                    <div class="space-y-4">
                        <div class="bg-app-card border border-app rounded-2xl p-4 md:p-5 space-y-3.5">
                            <div>
                                <h2 class="text-base font-bold text-app-primary">Section F — Evidence Log</h2>
                                <p class="text-xs text-app-secondary">Strictly separate what you directly observed from what you inferred.</p>
                            </div>

                            <form onsubmit="addEvidenceRecord(event, '${p.id}')" class="space-y-3 pt-1">
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                    <input type="text" id="ev-source" required placeholder="Source (e.g. Interview #4 - Sarah)" class="rounded-xl px-3 py-2 text-xs">
                                    <input type="date" id="ev-date" value="${new Date().toISOString().slice(0, 10)}" class="rounded-xl px-3 py-2 text-xs">
                                    <select id="ev-type" class="rounded-xl px-3 py-2 text-xs">
                                        ${EVIDENCE_TYPES.map(t => `<option value="${t.id}">${esc(t.label)}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-[#36C88C] mb-1">Direct Observation / Quote (Objective Fact) *</label>
                                    <textarea id="ev-observation" rows="2" required placeholder="What did the customer literally say, do, or pay?" class="w-full rounded-xl p-2.5 text-xs"></textarea>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                    <div>
                                        <label class="block text-[11px] font-bold text-[#F5B646] mb-1">Founder Interpretation (Inference)</label>
                                        <input type="text" id="ev-interpretation" placeholder="What do you think this means?" class="w-full rounded-xl px-3 py-2 text-xs">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-semibold text-app-secondary mb-1">Related Hypothesis & Reliability</label>
                                        <input type="text" id="ev-hypothesis" placeholder="Hypothesis tested / context notes" class="w-full rounded-xl px-3 py-2 text-xs">
                                    </div>
                                </div>
                                <button type="submit" class="btn-primary px-4 py-2.5 rounded-xl text-xs font-semibold">Record Evidence</button>
                            </form>
                        </div>

                        ${records.length === 0 ? `
                            <div class="bg-app-card border border-app rounded-2xl p-6 text-center text-xs text-app-secondary">
                                No evidence logged yet. Without behavioral or interview evidence, commercial scores reflect unverified assumptions.
                            </div>
                        ` : `
                            <div class="space-y-2.5">
                                ${records.map(ev => {
                                    const typeMeta = EVIDENCE_TYPES.find(t => t.id === ev.type);
                                    return `
                                        <div class="bg-app-card border border-app rounded-2xl p-4 space-y-2">
                                            <div class="flex items-center justify-between gap-2">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-md bg-[#5B93FF]/15 text-[#5B93FF]">${esc(typeMeta ? typeMeta.label : ev.type)}</span>
                                                    <span class="text-xs font-bold text-app-primary">${esc(ev.source)}</span>
                                                    <span class="text-[11px] text-app-secondary">${esc(ev.date)}</span>
                                                </div>
                                                <button onclick="deleteEvidenceRecord('${ev.id}')" class="text-app-secondary hover:text-[#F16E76] p-1"><i class="ph ph-trash"></i></button>
                                            </div>
                                            <div class="text-xs text-app-primary bg-app-primary border border-app rounded-xl p-2.5">
                                                <span class="text-[10px] font-bold uppercase text-[#36C88C] block mb-0.5">Observed Fact</span>
                                                ${esc(ev.observation)}
                                            </div>
                                            ${ev.interpretation ? `
                                                <div class="text-xs text-app-secondary">
                                                    <span class="font-semibold text-[#F5B646]">Founder Inference:</span> ${esc(ev.interpretation)}
                                                </div>
                                            ` : ''}
                                            ${ev.hypothesis ? `<div class="text-[11px] text-app-secondary">Hypothesis: ${esc(ev.hypothesis)}</div>` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `}
                    </div>
                `;
            }

            if (tab === 'viability') {
                return `
                    <div class="space-y-5">
                        <div class="bg-app-card border border-app rounded-2xl p-4 md:p-5 space-y-4">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-app pb-3">
                                <div>
                                    <h2 class="text-base font-bold text-app-primary">Validation Scorecard</h2>
                                    <p class="text-xs text-app-secondary">Commercial opportunity score is tracked separately from evidence confidence.</p>
                                </div>
                                <span class="text-[11px] font-semibold px-2.5 py-1 rounded-xl bg-app-elevated text-app-secondary">
                                    Completeness: ${evalRes.completenessPct}%
                                </span>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div class="bg-app-primary border border-app rounded-xl p-3.5">
                                    <div class="text-[11px] font-semibold text-app-secondary">Opportunity Score</div>
                                    <div class="text-2xl font-bold text-[#5B93FF] mt-0.5">
                                        ${evalRes.normalizedScore !== null ? `${evalRes.normalizedScore}<span class="text-sm text-app-secondary">/100</span>` : '—'}
                                    </div>
                                    <div class="text-[11px] text-app-secondary mt-1">
                                        ${evalRes.normalizedScore === null ? 'Rate dimensions below' : evalRes.isComplete ? 'All 8 dimensions rated' : `Provisional (${evalRes.missingDimensions.length} missing)`}
                                    </div>
                                </div>

                                <div class="bg-app-primary border border-app rounded-xl p-3.5">
                                    <div class="text-[11px] font-semibold text-app-secondary">Evidence Confidence</div>
                                    <div class="text-sm font-bold mt-1" style="color:${evalRes.confidenceColor};">${esc(evalRes.confidenceLabel)}</div>
                                    <div class="text-[11px] text-app-secondary mt-1">${evalRes.evidenceCount} evidence · ${evalRes.interviewCount} interviews</div>
                                </div>

                                <div class="bg-app-primary border border-app rounded-xl p-3.5">
                                    <div class="text-[11px] font-semibold text-app-secondary">Regulatory Exposure</div>
                                    <div class="text-sm font-bold mt-1 ${evalRes.regulatoryLevel === 'High' ? 'text-[#F16E76]' : evalRes.regulatoryLevel === 'Moderate' ? 'text-[#F5B646]' : 'text-app-primary'}">
                                        ${esc(evalRes.regulatoryLevel)}
                                    </div>
                                    <div class="text-[11px] text-app-secondary mt-1">Evaluated separately from score</div>
                                </div>
                            </div>

                            ${!evalRes.isComplete ? `
                                <div class="bg-[#F5B646]/10 border border-[#F5B646]/30 rounded-xl p-3 text-xs text-[#F5B646]">
                                    <span class="font-bold">Missing Ratings:</span> ${esc(evalRes.missingDimensions.join(', '))}. Unknown dimensions are excluded rather than treated as zero.
                                </div>
                            ` : ''}

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                <div class="bg-app-primary border border-app rounded-xl p-3 space-y-1">
                                    <div class="font-bold text-[#36C88C]">Strongest Commercial Indicators</div>
                                    <div class="text-app-secondary">
                                        ${evalRes.strongest.length > 0 ? evalRes.strongest.map(s => `${s.label} (${s.score}/5)`).join(', ') : 'No dimensions rated ≥ 4 yet.'}
                                    </div>
                                </div>
                                <div class="bg-app-primary border border-app rounded-xl p-3 space-y-1">
                                    <div class="font-bold text-[#F16E76]">Weakest Assumptions / Risks</div>
                                    <div class="text-app-secondary">
                                        ${evalRes.weakestAssumptions.length > 0 ? evalRes.weakestAssumptions.map(w => `${w.label} (${w.score}/5, ${w.confidence} conf.)`).join(', ') : 'Rate dimensions and attach evidence to surface risks.'}
                                    </div>
                                </div>
                            </div>

                            <div class="bg-app-primary border border-app rounded-xl p-3.5 space-y-1.5 text-xs">
                                <div><span class="font-bold text-app-primary">Most Important Unanswered Question:</span> <span class="text-app-secondary">${esc(evalRes.unansweredQuestion)}</span></div>
                                <div><span class="font-bold text-[#5B93FF]">Recommended Next Validation Action:</span> <span class="text-app-primary">${esc(evalRes.nextAction)}</span></div>
                                <p class="text-[11px] text-app-secondary pt-1 border-t border-app">
                                    Calculation: Weighted normalized average across rated 0–5 dimensions (Weights configured in Settings). High pain never guarantees willingness to pay.
                                </p>
                            </div>
                        </div>

                        <div class="space-y-3">
                            ${VIABILITY_DIMENSIONS.map(dim => {
                                const entry = p.viability[dim.key];
                                const w = db.scoringWeights[dim.weightKey] || 0;
                                return `
                                    <div class="bg-app-card border border-app rounded-2xl p-4 space-y-3">
                                        <div class="flex items-start justify-between gap-2">
                                            <div>
                                                <div class="text-sm font-bold text-app-primary">${esc(dim.label)} <span class="text-xs font-normal text-app-secondary">(Weight: ${w}%)</span></div>
                                                <p class="text-xs text-app-secondary mt-0.5">${esc(dim.desc)}</p>
                                            </div>
                                            <select onchange="updateViabilityField('${p.id}', '${dim.key}', 'confidence', this.value)" class="rounded-xl px-2.5 py-1 text-[11px] font-semibold">
                                                ${['Low', 'Moderate', 'High'].map(c => `<option value="${c}" ${entry.confidence === c ? 'selected' : ''}>Conf: ${c}</option>`).join('')}
                                            </select>
                                        </div>

                                        <div class="flex items-center gap-1.5">
                                            ${[0, 1, 2, 3, 4, 5].map(num => {
                                                const active = entry.score === num;
                                                return `
                                                    <button type="button" onclick="updateViabilityScore('${p.id}', '${dim.key}', ${num})"
                                                        class="flex-1 py-2.5 rounded-xl text-xs font-bold border transition-colors ${active ? 'btn-primary border-[#5B93FF]' : 'bg-app-primary border-app text-app-secondary hover:text-app-primary'}">
                                                        ${num}
                                                    </button>
                                                `;
                                            }).join('')}
                                        </div>

                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                            <input type="text" value="${esc(entry.evidence)}" onchange="updateViabilityField('${p.id}', '${dim.key}', 'evidence', this.value)"
                                                placeholder="Supporting evidence..." class="rounded-xl px-3 py-2 text-xs">
                                            <input type="text" value="${esc(entry.assumptions)}" onchange="updateViabilityField('${p.id}', '${dim.key}', 'assumptions', this.value)"
                                                placeholder="Unverified assumptions..." class="rounded-xl px-3 py-2 text-xs">
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div class="bg-app-card border border-app rounded-2xl p-4 space-y-3">
                            <div class="flex items-center justify-between gap-2">
                                <div>
                                    <h3 class="text-sm font-bold text-app-primary">Regulatory & Compliance Exposure</h3>
                                    <p class="text-xs text-app-secondary">Legal, licensing, data privacy, or sector compliance constraints.</p>
                                </div>
                                <select onchange="updateNestedProblem('${p.id}', 'regulatory', 'level', this.value)" class="rounded-xl px-3 py-2 text-xs font-semibold">
                                    ${['Unknown', 'Low', 'Moderate', 'High'].map(lvl => `<option value="${lvl}" ${p.regulatory.level === lvl ? 'selected' : ''}>Risk: ${lvl}</option>`).join('')}
                                </select>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                <input type="text" value="${esc(p.regulatory.notes)}" onchange="updateNestedProblem('${p.id}', 'regulatory', 'notes', this.value)"
                                    placeholder="Specific legal/compliance requirements..." class="rounded-xl px-3 py-2 text-xs">
                                <input type="text" value="${esc(p.regulatory.assumptions)}" onchange="updateNestedProblem('${p.id}', 'regulatory', 'assumptions', this.value)"
                                    placeholder="Regulatory assumptions to verify..." class="rounded-xl px-3 py-2 text-xs">
                            </div>
                        </div>
                    </div>
                `;
            }

            if (tab === 'coach') {
                return renderGuidedCoachSection(p);
            }

            if (tab === 'interviews') {
                return renderInterviewsSection(p);
            }

            if (tab === 'experiments') {
                return renderExperimentsSection(p);
            }

            return '';
        }

        function updateProblemField(problemId, field, value) {
            const p = db.problems.find(x => x.id === problemId);
            if (!p) return;
            p[field] = value;
            if (!p.problemStatementEdited) {
                p.problemStatement = generateProblemStatement(p);
            }
            p.updatedAt = nowISO();
            persist();
            if (field === 'title') renderHeader();
            renderApp();
        }

        function updateNestedProblem(problemId, group, field, value) {
            const p = db.problems.find(x => x.id === problemId);
            if (!p || !p[group]) return;
            p[group][field] = value;
            p.updatedAt = nowISO();
            persist();
            if (group === 'regulatory') renderApp();
        }

        function updateFiveWhy(problemId, index, value) {
            const p = db.problems.find(x => x.id === problemId);
            if (!p) return;
            p.rootCause.fiveWhys[index] = value;
            p.updatedAt = nowISO();
            persist();
        }

        function updateProblemStatementManual(problemId, value) {
            const p = db.problems.find(x => x.id === problemId);
            if (!p) return;
            p.problemStatement = value;
            p.problemStatementEdited = true;
            p.updatedAt = nowISO();
            persist();
        }

        function regenerateProblemStatement(problemId) {
            const p = db.problems.find(x => x.id === problemId);
            if (!p) return;
            p.problemStatement = generateProblemStatement(p);
            p.problemStatementEdited = false;
            p.updatedAt = nowISO();
            persist();
            renderApp();
            showToast('Statement regenerated');
        }

        function toggleProblemPersonLink(problemId, personId) {
            const p = db.problems.find(x => x.id === problemId);
            if (!p) return;
            const idx = p.personIds.indexOf(personId);
            if (idx > -1) p.personIds.splice(idx, 1);
            else p.personIds.push(personId);
            p.updatedAt = nowISO();
            persist();
            renderApp();
        }

        function toggleProblemIncentive(problemId, incId) {
            const p = db.problems.find(x => x.id === problemId);
            if (!p) return;
            const idx = p.incentives.indexOf(incId);
            if (idx > -1) p.incentives.splice(idx, 1);
            else p.incentives.push(incId);
            p.updatedAt = nowISO();
            persist();
            renderApp();
        }

        function openAddCustomIncentiveModal(problemId) {
            const panel = document.getElementById('modal-panel');
            if (!panel) return;
            panel.innerHTML = `
                <div class="w-9 h-1 rounded-full bg-app-elevated mx-auto mt-2.5 mb-0.5 sm:hidden shrink-0"></div>
                <form onsubmit="submitCustomIncentive(event, '${problemId}')" class="p-5 space-y-3.5">
                    <h3 class="text-base font-bold text-app-primary">Add Custom Incentive</h3>
                    <div>
                        <label class="block text-xs font-semibold text-app-secondary mb-1">Incentive Name *</label>
                        <input type="text" id="cust-inc-label" required placeholder="e.g. Regulatory Peace of Mind" class="w-full rounded-xl px-3 py-2.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-app-secondary mb-1">Plain-English Explanation</label>
                        <input type="text" id="cust-inc-desc" placeholder="What motivates the person to act?" class="w-full rounded-xl px-3 py-2.5 text-xs">
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-app-secondary">Cancel</button>
                        <button type="submit" class="btn-primary px-4 py-2 rounded-xl text-xs font-semibold">Add Incentive</button>
                    </div>
                </form>
            `;
            openModal();
        }

        function submitCustomIncentive(e, problemId) {
            e.preventDefault();
            const label = document.getElementById('cust-inc-label')?.value.trim();
            const desc = document.getElementById('cust-inc-desc')?.value.trim() || 'Custom behavioral incentive.';
            if (!label) return;
            const id = uid('inc');
            db.customIncentives.push({ id, label, desc });
            const p = db.problems.find(x => x.id === problemId);
            if (p) p.incentives.push(id);
            persist(`Added custom incentive "${label}"`);
            closeModal();
            renderApp();
        }

        function addEvidenceRecord(e, problemId) {
            e.preventDefault();
            const source = document.getElementById('ev-source')?.value.trim();
            const date = document.getElementById('ev-date')?.value || new Date().toISOString().slice(0, 10);
            const type = document.getElementById('ev-type')?.value || 'interview_note';
            const observation = document.getElementById('ev-observation')?.value.trim();
            const interpretation = document.getElementById('ev-interpretation')?.value.trim() || '';
            const hypothesis = document.getElementById('ev-hypothesis')?.value.trim() || '';
            if (!source || !observation) return;

            const p = db.problems.find(x => x.id === problemId);
            db.evidence.unshift({
                id: uid('ev'),
                problemId,
                projectId: p?.projectId || '',
                source,
                date,
                type,
                observation,
                interpretation,
                hypothesis,
                reliability: ''
            });
            if (p) p.updatedAt = nowISO();
            persist(`Logged evidence from "${source}"`);
            showToast('Evidence recorded');
            renderApp();
        }

        function deleteEvidenceRecord(evId) {
            db.evidence = db.evidence.filter(e => e.id !== evId);
            persist();
            renderApp();
        }

        function updateViabilityScore(problemId, dimKey, score) {
            const p = db.problems.find(x => x.id === problemId);
            if (!p) return;
            p.viability[dimKey].score = p.viability[dimKey].score === score ? null : score;
            p.updatedAt = nowISO();
            persist();
            renderApp();
        }

        function updateViabilityField(problemId, dimKey, field, value) {
            const p = db.problems.find(x => x.id === problemId);
            if (!p) return;
            p.viability[dimKey][field] = value;
            p.updatedAt = nowISO();
            persist();
            if (field === 'confidence') renderApp();
        }

        function confirmDeleteProblem(problemId) {
            const p = db.problems.find(x => x.id === problemId);
            if (!p) return;
            openConfirmDialog({
                title: 'Delete Problem?',
                message: `Permanently delete "${p.title}" and its linked evidence records?`,
                confirmLabel: 'Delete',
                danger: true,
                onConfirm: () => {
                    db.problems = db.problems.filter(x => x.id !== problemId);
                    db.evidence = db.evidence.filter(e => e.problemId !== problemId);
                    db.interviews = db.interviews.filter(i => i.problemId !== problemId);
                    db.experiments = db.experiments.filter(ex => ex.problemId !== problemId);
                    persist(`Deleted problem "${p.title}"`);
                    switchTab('pipeline');
                    showToast('Problem deleted');
                }
            });
        }

        // =========================================================================
        // 12. GUIDED FIRST-PRINCIPLES COACH
        // =========================================================================
        let coachStepIdx = 0;

        function getCoachQuestions(p) {
            return [
                {
                    key: 'whoExperiences',
                    question: 'Which specific person or customer role experiences this problem most acutely?',
                    whyMatters: 'Broad audiences ("small businesses" or "everyone") hide urgent buyers. Narrowing to a specific role reveals who actually feels the pain and holds budget.',
                    currentValue: p.whoExperiences,
                    apply: (val) => { p.whoExperiences = val; }
                },
                {
                    key: 'context',
                    question: 'Under what exact circumstances or triggering moment does the problem occur?',
                    whyMatters: 'Context separates hypothetical interest from real operational friction. Knowing when and where the pain strikes dictates how you reach and serve them.',
                    currentValue: p.context,
                    apply: (val) => { p.context = val; }
                },
                {
                    key: 'consequence',
                    question: 'What concrete consequence does the problem create when it happens?',
                    whyMatters: 'If there is no measurable loss of money, time, status, or safety, customers will tolerate the status quo rather than pay for a change.',
                    currentValue: p.consequence,
                    apply: (val) => { p.consequence = val; }
                },
                {
                    key: 'supportingObservation',
                    question: 'What concrete evidence do you have that this happens repeatedly?',
                    whyMatters: 'A single anecdote can mislead you. Documenting recurring real-world behavior protects you from building for an edge case.',
                    currentValue: p.supportingObservation,
                    apply: (val) => { p.supportingObservation = val; }
                },
                {
                    key: 'currentWorkaround',
                    question: 'What are these people currently doing or paying to work around it?',
                    whyMatters: 'Active workarounds prove the problem matters enough to expend effort. No workaround often signals low urgency.',
                    currentValue: p.desiredOutcome.currentWorkaround,
                    apply: (val) => { p.desiredOutcome.currentWorkaround = val; p.alternatives.workarounds = val; }
                },
                {
                    key: 'whatTheyWant',
                    question: 'What tangible outcome would make them consider the problem completely solved?',
                    whyMatters: 'Defining the desired outcome prevents premature solution bias and anchors your value proposition in customer reality.',
                    currentValue: p.desiredOutcome.whatTheyWant,
                    apply: (val) => { p.desiredOutcome.whatTheyWant = val; }
                }
            ];
        }

        function renderGuidedCoachSection(p) {
            const questions = getCoachQuestions(p);
            if (coachStepIdx >= questions.length) coachStepIdx = 0;
            const q = questions[coachStepIdx];
            const answeredCount = questions.filter(item => item.currentValue && item.currentValue.trim()).length;

            return `
                <div class="bg-app-card border border-app rounded-2xl p-5 space-y-4">
                    <div class="flex items-center justify-between gap-2">
                        <div>
                            <span class="text-[11px] font-bold uppercase tracking-wider text-[#5B93FF]">Rule-Based First-Principles Coach</span>
                            <h2 class="text-base font-bold text-app-primary mt-0.5">Question ${coachStepIdx + 1} of ${questions.length}</h2>
                        </div>
                        <span class="text-xs font-semibold text-app-secondary">${answeredCount}/${questions.length} answered</span>
                    </div>

                    <div class="bg-app-primary border border-app rounded-xl p-3 text-xs text-app-secondary">
                        <span class="font-bold text-app-primary">Investigating:</span> "${esc(p.title)}"
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-bold text-app-primary leading-snug">${esc(q.question)}</label>
                        <textarea id="coach-answer-input" rows="3" placeholder="Write clear, concrete facts..." class="w-full rounded-xl p-3 text-sm">${esc(q.currentValue || '')}</textarea>
                    </div>

                    <details class="bg-app-primary border border-app rounded-xl p-3 text-xs">
                        <summary class="font-semibold text-[#F5B646] cursor-pointer">Why does this matter?</summary>
                        <p class="text-app-secondary mt-2 leading-relaxed">${esc(q.whyMatters)}</p>
                    </details>

                    <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-app">
                        <div class="flex items-center gap-2">
                            <button type="button" onclick="coachNavigate('${p.id}', -1, false)" ${coachStepIdx === 0 ? 'disabled' : ''}
                                class="px-3 py-2 rounded-xl text-xs font-semibold border border-app text-app-secondary disabled:opacity-40">
                                Back
                            </button>
                            <button type="button" onclick="coachNavigate('${p.id}', 1, false)"
                                class="px-3 py-2 rounded-xl text-xs font-semibold border border-app text-app-secondary">
                                Skip
                            </button>
                        </div>

                        <div class="flex items-center gap-2">
                            <button type="button" onclick="coachSaveCurrent('${p.id}', false)" class="px-3 py-2 rounded-xl text-xs font-semibold border border-app bg-app-elevated text-app-primary">
                                Save Progress
                            </button>
                            ${coachStepIdx < questions.length - 1 ? `
                                <button type="button" onclick="coachSaveCurrent('${p.id}', true)" class="btn-primary px-4 py-2 rounded-xl text-xs font-semibold">
                                    Save & Continue
                                </button>
                            ` : `
                                <button type="button" onclick="coachFinish('${p.id}')" class="btn-primary px-4 py-2 rounded-xl text-xs font-semibold">
                                    Finish Session
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function coachSaveCurrent(problemId, advance) {
            const p = db.problems.find(x => x.id === problemId);
            if (!p) return;
            const questions = getCoachQuestions(p);
            const q = questions[coachStepIdx];
            const val = document.getElementById('coach-answer-input')?.value.trim() || '';
            q.apply(val);
            p.coachAnswers[q.key] = val;
            if (!p.problemStatementEdited) {
                p.problemStatement = generateProblemStatement(p);
            }
            p.updatedAt = nowISO();
            persist(`Updated discovery answers for "${p.title}"`);
            showToast('Answer saved');
            if (advance && coachStepIdx < questions.length - 1) {
                coachStepIdx++;
            }
            renderApp();
        }

        function coachNavigate(problemId, delta, saveFirst) {
            if (saveFirst) coachSaveCurrent(problemId, false);
            coachStepIdx = Math.max(0, coachStepIdx + delta);
            renderApp();
        }

        function coachFinish(problemId) {
            coachSaveCurrent(problemId, false);
            coachStepIdx = 0;
            nav.problemSubTab = 'definition';
            renderApp();
        }

                        </div>
                    `).join('')}
                </div>
            `;
        }

        function addInterviewRecord(e, problemId) {
            e.preventDefault();
            const interviewee = document.getElementById('int-interviewee')?.value.trim();
            const date = document.getElementById('int-date')?.value || new Date().toISOString().slice(0, 10);
            const objective = document.getElementById('int-objective')?.value.trim() || '';
            const quotes = document.getElementById('int-quotes')?.value.trim();
            const followup = document.getElementById('int-followup')?.value.trim() || '';
            if (!interviewee || !quotes) return;

            const p = db.problems.find(x => x.id === problemId);
            db.interviews.unshift({
                id: uid('int'),
                problemId,
                projectId: p?.projectId || '',
                interviewee,
                date,
                objective,
                quotes,
                followup
            });
            if (p) p.updatedAt = nowISO();
            persist(`Logged discovery interview with "${interviewee}"`);
            showToast('Interview saved');
            renderApp();
        }

        function convertInterviewToEvidence(interviewId) {
            const item = db.interviews.find(i => i.id === interviewId);
            if (!item) return;
            db.evidence.unshift({
                id: uid('ev'),
                problemId: item.problemId,
                projectId: item.projectId || '',
                source: `Interview: ${item.interviewee}`,
                date: item.date,
                type: 'direct_quote',
                observation: item.quotes,
                interpretation: '',
                hypothesis: item.objective,
                reliability: 'Promoted from customer discovery interview'
            });
            persist(`Promoted interview insight from "${item.interviewee}" to Evidence`);
            showToast('Added to Evidence Log');
            renderApp();

            return `

        function addExperimentRecord(e, problemId) {
            e.preventDefault();
            const hypothesis = document.getElementById('exp-hyp')?.value.trim();
            const method = document.getElementById('exp-method')?.value || 'Customer Interviews';
            const evidenceNeeded = document.getElementById('exp-needed')?.value.trim() || '';
            const successCriteria = document.getElementById('exp-criteria')?.value.trim() || '';
            if (!hypothesis) return;

            const p = db.problems.find(x => x.id === problemId);
            db.experiments.unshift({
                id: uid('exp'),
                problemId,
                projectId: p?.projectId || '',
                hypothesis,
                method,
                evidenceNeeded,
                successCriteria,
                result: '',
                decision: 'Pending',
                createdAt: nowISO()
            });
            if (p) p.updatedAt = nowISO();
            persist(`Created experiment for "${p?.title || 'problem'}"`);
            showToast('Experiment added');
            renderApp();
        }

        function updateExperimentResult(expId, result) {
            const ex = db.experiments.find(x => x.id === expId);
            if (!ex) return;
            ex.result = result;
            persist();
        }

        function updateExperimentDecision(expId, decision) {
            const ex = db.experiments.find(x => x.id === expId);
            if (!ex) return;
            ex.decision = decision;
            persist(`Experiment decision set to ${decision}`);
            showToast(`Decision: ${decision}`);
            renderApp();

            const existing = db.opportunities.find(o => o.problemId === problemId);
            if (existing) {
                openOpportunityDetail(existing.id);
                return;

            const p = db.problems.find(x => x.id === problemId);
            if (!p) return;

            const opp = {
                id: uid('opp'),
                problemId: p.id,
                projectId: p.projectId || '',
                title: p.title,
                solutionHypotheses: '',
                nextExperiment: evaluateProblemScore(p).nextAction,
                createdAt: nowISO(),
                updatedAt: nowISO()
            };
            db.opportunities.unshift(opp);
            persist(`Created opportunity from "${p.title}"`);
            showToast('Opportunity created');
            openOpportunityDetail(opp.id);
        }

                const evalRes = prob ? evaluateProblemScore(prob) : null;
                return { opp, prob, evalRes };
            });

            if (nav.oppSearch.trim()) {

            items.sort((a, b) => {
                if (nav.oppSort === 'confidence') return (b.evalRes?.confidencePct ?? -1) - (a.evalRes?.confidencePct ?? -1);
                return (b.evalRes?.normalizedScore ?? -1) - (a.evalRes?.normalizedScore ?? -1);

                                    const atp = prob?.viability?.abilityToPay?.score;

                    showToast('Maximum 3 opportunities in comparison');
                    return;
                }
                nav.compareIds.push(oppId);

            renderApp();

            const panel = document.getElementById('modal-panel');

            panel.innerHTML = `
                <div class="w-9 h-1 rounded-full bg-app-elevated mx-auto mt-2.5 mb-0.5 sm:hidden shrink-0"></div>

        function selectProjColor(c) {
            selectedProjectColor = c;
            document.querySelectorAll('#proj-color-row button').forEach(btn => {
                if (btn.dataset.c === c) {
                    btn.classList.add('ring-2', 'ring-white', 'scale-110');
                    btn.classList.remove('opacity-75');
                } else {
                    btn.classList.remove('ring-2', 'ring-white', 'scale-110');
                    btn.classList.add('opacity-75');
                }
            });
        }

        function submitProjectForm(e, projectId) {
            e.preventDefault();
            const name = document.getElementById('proj-name')?.value.trim();
            const description = document.getElementById('proj-desc')?.value.trim() || '';
            if (!name) return;

            if (projectId) {
                const proj = db.projects.find(p => p.id === projectId);
                if (proj) {
                    proj.name = name;
                    proj.color = selectedProjectColor;
                    proj.description = description;
                }
                persist(`Updated project "${name}"`);
                showToast('Project updated');
            } else {
                db.projects.unshift({
                    id: uid('proj'),
                    name,
                    color: selectedProjectColor,
                    description,
                    archived: false,
                    createdAt: nowISO()
                });
                persist(`Created project "${name}"`);
                showToast('Project created');
            }
            closeModal();
            renderApp();
        }

        function toggleArchiveProject(projectId) {
            const proj = db.projects.find(p => p.id === projectId);
            if (!proj) return;
            proj.archived = !proj.archived;
            persist(`${proj.archived ? 'Archived' : 'Restored'} project "${proj.name}"`);
            showToast(proj.archived ? 'Project archived' : 'Project restored');
            renderApp();
        }

        function confirmDeleteProject(projectId) {
            const proj = db.projects.find(p => p.id === projectId);
            if (!proj) return;
            openConfirmDialog({
                title: 'Delete Project Folder?',
                message: `Delete "${proj.name}"? Associated people, problems, evidence, and opportunities will remain preserved as unassigned.`,
                confirmLabel: 'Delete Folder',
                danger: true,
                onConfirm: () => {
                    db.projects = db.projects.filter(p => p.id !== projectId);
                    db.problems.forEach(x => { if (x.projectId === projectId) x.projectId = ''; });
                    db.people.forEach(x => { if (x.projectId === projectId) x.projectId = ''; });
                    db.evidence.forEach(x => { if (x.projectId === projectId) x.projectId = ''; });
                    db.opportunities.forEach(x => { if (x.projectId === projectId) x.projectId = ''; });
                    persist(`Deleted project folder "${proj.name}"`);
                    showToast('Folder deleted; research preserved');
                    renderApp();
                }
            });
        }

                                            Dark Mode
                                        </button>
                                        <button type="button" onclick="db.theme = 'light'; persist(); renderApp();"
                                            class="py-2.5 rounded-xl text-xs font-semibold border ${db.theme === 'light' ? 'btn-primary border-[#5B93FF]' : 'border-app bg-app-primary text-app-secondary'}">
                                            Light Mode
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section class="bg-app-card border border-app rounded-2xl p-4 md:p-5 space-y-3.5">
                            <div class="flex items-center justify-between gap-2">
                                <div>
                                    <h2 class="text-sm font-bold text-app-primary">Validation Scoring Weights</h2>
                                    <p class="text-xs text-app-secondary">Adjust relative dimension weights (Recommended sum: 100%).</p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-bold ${totalWeight === 100 ? 'text-[#36C88C]' : 'text-[#F5B646]'}">Total: ${totalWeight}%</span>
                                    <button type="button" onclick="db.scoringWeights = {...DEFAULT_WEIGHTS}; persist(); renderApp(); showToast('Weights reset');"
                                        class="text-xs text-[#5B93FF] hover:underline">Reset</button>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                ${VIABILITY_DIMENSIONS.map(dim => `
                                    <div class="flex items-center justify-between gap-2 bg-app-primary border border-app rounded-xl px-3 py-2">
                                        <span class="text-xs text-app-primary">${esc(dim.label)}</span>
                                        <div class="flex items-center gap-1">
                                            <input type="number" min="0" max="100" value="${db.scoringWeights[dim.weightKey] ?? 0}"
                                                onchange="updateScoringWeight('${dim.weightKey}', this.value)"
                                                class="w-16 rounded-lg px-2 py-1 text-xs text-right font-bold">
                                            <span class="text-xs text-app-secondary">%</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </section>

                        <section class="bg-app-card border border-app rounded-2xl p-4 md:p-5 space-y-3.5">
                            <div>
                                <h2 class="text-sm font-bold text-app-primary">Data Export & Import (JSON)</h2>
                                <p class="text-xs text-app-secondary mt-0.5">
                                    All records are stored locally in this browser's storage. Clearing browser site data will erase local records unless you export a backup.
                                </p>
                            </div>

                            <div class="flex flex-wrap gap-2.5">
                                <button type="button" onclick="exportWorkspaceJSON()" class="btn-primary px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-1.5">
                                    <i class="ph-bold ph-download-simple"></i> Export Workspace JSON
                                </button>
                                <label class="px-4 py-2.5 rounded-xl text-xs font-semibold border border-app bg-app-elevated text-app-primary cursor-pointer flex items-center gap-1.5">
                                    <i class="ph-bold ph-upload-simple"></i> Import Workspace JSON
                                    <input type="file" accept=".json,application/json" onchange="handleImportFileSelect(event)" class="hidden">
                                </label>
                                <button type="button" onclick="loadDemoWorkspace()" class="px-4 py-2.5 rounded-xl text-xs font-semibold border border-app bg-app-primary text-app-secondary hover:text-app-primary">
                                    Insert Sample Scenario
                                </button>
                            </div>
                        </section>

                        <section class="bg-app-card border border-app rounded-2xl p-4 md:p-5 space-y-3">
                            <h2 class="text-sm font-bold text-app-primary">Onboarding & Reset</h2>
                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <button type="button" onclick="onboardingStep = 1; db.onboardingCompleted = false; renderApp();"
                                    class="px-3.5 py-2 rounded-xl text-xs font-semibold border border-app bg-app-primary text-app-primary">
                                    Replay Onboarding Guide
                                </button>
                                <button type="button" onclick="confirmClearAllData()"
                                    class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-[#F16E76]/15 text-[#F16E76] border border-[#F16E76]/30">
                                    Clear All Workspace Data
                                </button>
                            </div>
                            <p class="text-[11px] text-app-secondary pt-2 border-t border-app">
                                Venture Validator v1.0 · Client-side offline-capable discovery system. Validate the problem before building the solution.
                            </p>
                        </section>
                    </div>
                </div>
            `;
        }

        function updateScoringWeight(key, val) {
            const num = Math.max(0, Math.min(100, Number(val) || 0));
            db.scoringWeights[key] = num;
            persist();
            renderApp();
        }

        function exportWorkspaceJSON() {
            const payload = {
                exportedAt: nowISO(),
                app: 'Venture Validator',
                ...db
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `venture-validator-backup-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Workspace exported');
        }

        function handleImportFileSelect(e) {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    const sanitized = sanitizeLoadedData(parsed);
                    showImportPreviewModal(sanitized);
                } catch (err) {
                    showToast('Invalid JSON backup file');
                }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        function showImportPreviewModal(importedState) {
            const panel = document.getElementById('modal-panel');
            if (!panel) return;
            window._pendingImport = importedState;

            panel.innerHTML = `
                <div class="w-9 h-1 rounded-full bg-app-elevated mx-auto mt-2.5 mb-0.5 sm:hidden shrink-0"></div>
                <div class="p-5 space-y-4">
                    <h3 class="text-base font-bold text-app-primary">Import Workspace Preview</h3>
                    <p class="text-xs text-app-secondary">Review the imported counts before replacing or merging with your current workspace:</p>
                    <div class="grid grid-cols-2 gap-2 bg-app-primary border border-app rounded-xl p-3 text-xs">
                        <div>Projects: <strong class="text-app-primary">${importedState.projects.length}</strong></div>
                        <div>People: <strong class="text-app-primary">${importedState.people.length}</strong></div>
                        <div>Problems: <strong class="text-app-primary">${importedState.problems.length}</strong></div>
                        <div>Evidence: <strong class="text-app-primary">${importedState.evidence.length}</strong></div>
                        <div>Opportunities: <strong class="text-app-primary">${importedState.opportunities.length}</strong></div>
                        <div>Schema v${importedState.schemaVersion}</div>
                    </div>
                    <div class="flex flex-col sm:flex-row justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-app-secondary">Cancel</button>
                        <button type="button" onclick="applyWorkspaceImport('merge')" class="px-4 py-2 rounded-xl text-xs font-semibold border border-app bg-app-elevated text-app-primary">Merge Records</button>
                        <button type="button" onclick="applyWorkspaceImport('replace')" class="btn-primary px-4 py-2 rounded-xl text-xs font-semibold">Replace Workspace</button>
                    </div>
                </div>
            `;
            openModal();
        }

        function applyWorkspaceImport(mode) {
            const imp = window._pendingImport;
            if (!imp) return;
            if (mode === 'replace') {
                db = imp;
                db.onboardingCompleted = true;
            } else {
                const mergeById = (target, incoming) => {
                    const existingIds = new Set(target.map(x => x.id));
                    incoming.forEach(item => {
                        if (!existingIds.has(item.id)) target.push(item);
                    });
                };
                mergeById(db.projects, imp.projects);
                mergeById(db.people, imp.people);
                mergeById(db.problems, imp.problems);
                mergeById(db.evidence, imp.evidence);
                mergeById(db.interviews, imp.interviews);
                mergeById(db.experiments, imp.experiments);
                mergeById(db.opportunities, imp.opportunities);
            }
            window._pendingImport = null;
            persist(`Imported workspace (${mode})`);
            closeModal();
            showToast('Workspace imported');
            renderApp();
        }

        function confirmClearAllData() {
            openConfirmDialog({
                title: 'Clear All Workspace Data?',
                message: 'This will permanently erase all projects, people, problems, evidence, interviews, experiments, and opportunities stored in this browser.',
                confirmLabel: 'Erase Everything',
                danger: true,
                onConfirm: () => {
                    db = createEmptyState();
                    db.onboardingCompleted = true;
                    persist();
                    switchTab('dashboard');
                    showToast('All local data cleared');
                }
            });
        }

        // =========================================================================
        // 18. MODAL & CONFIRMATION DIALOG UTILITIES
        // =========================================================================
        function openModal() {
            const backdrop = document.getElementById('modal-backdrop');
            if (!backdrop) return;
            backdrop.classList.remove('hidden');
            backdrop.classList.add('flex');
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            if (!backdrop) return;
            backdrop.classList.add('hidden');
            backdrop.classList.remove('flex');
        }

        function handleBackdropClick(e) {
            if (e.target.id === 'modal-backdrop') closeModal();
        }

        function openConfirmDialog({ title, message, confirmLabel = 'Confirm', danger = false, onConfirm }) {
            const panel = document.getElementById('modal-panel');
            if (!panel) return;
            window._confirmAction = onConfirm;
            panel.innerHTML = `
                <div class="w-9 h-1 rounded-full bg-app-elevated mx-auto mt-2.5 mb-0.5 sm:hidden shrink-0"></div>
                <div class="p-5 space-y-4">
                    <h3 class="text-base font-bold text-app-primary">${esc(title)}</h3>
                    <p class="text-xs text-app-secondary leading-relaxed">${esc(message)}</p>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-app-secondary">Cancel</button>
                        <button type="button" onclick="closeModal(); if (window._confirmAction) window._confirmAction();"
                            class="px-4 py-2 rounded-xl text-xs font-semibold ${danger ? 'bg-[#F16E76] text-white' : 'btn-primary'}">
                            ${esc(confirmLabel)}
                        </button>
                    </div>
                </div>
            `;
            openModal();
        }

        // Boot Application
        renderApp();
    </script>
</body>
</html>
