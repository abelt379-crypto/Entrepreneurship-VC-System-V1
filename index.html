<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <meta name="theme-color" content="#0D1015">
    <title>Venture Validator — Validate the problem before building the solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0D1015;
            --bg-secondary: #131820;
            --bg-card: #191F29;
            --bg-elevated: #212936;
            --accent-primary: #5B93FF;
            --accent-success: #36C88C;
            --accent-warning: #F5B646;
            --accent-danger: #F16E76;
            --text-primary: #F3F6FA;
            --text-secondary: #98A5B5;
            --border-color: #27303E;
            --focus-ring: rgba(91, 147, 255, 0.28);
            --nav-pill: rgba(91, 147, 255, 0.16);
            --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
        }

        html.light {
            --bg-primary: #F4F6F9;
            --bg-secondary: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-elevated: #EDF1F6;
            --accent-primary: #2563EB;
            --accent-success: #059669;
            --accent-warning: #D97706;
            --accent-danger: #DC2626;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --border-color: #D6DEE8;
            --focus-ring: rgba(37, 99, 235, 0.22);
            --nav-pill: rgba(37, 99, 235, 0.12);
            --card-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            overscroll-behavior: none;
            margin: 0;
            letter-spacing: -0.011em;
            line-height: 1.45;
        }

        .bg-app-primary { background-color: var(--bg-primary); }
        .bg-app-secondary { background-color: var(--bg-secondary); }
        .bg-app-card {
            background-color: var(--bg-card);
            box-shadow: var(--card-shadow);
        }
        .bg-app-elevated { background-color: var(--bg-elevated); }
        .text-app-primary { color: var(--text-primary); }
        .text-app-secondary { color: var(--text-secondary); }
        .border-app { border-color: var(--border-color); }

        .btn-primary {
            background-color: var(--accent-primary);
            color: #FFFFFF;
            transition: background-color 0.15s ease, filter 0.15s ease, transform 0.1s cubic-bezier(0.2, 0, 0, 1);
        }
        .btn-primary:hover {
            filter: brightness(1.07);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }

        button, select, [role="button"] {
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s cubic-bezier(0.2, 0, 0, 1);
        }
        button:active:not(:disabled) {
            transform: scale(0.985);
        }

        .scroll-y {
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            scroll-behavior: smooth;
        }
        .scroll-x {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            scroll-behavior: smooth;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 9999px; }

        .touch-target {
            min-height: 44px;
            min-width: 44px;
        }

        .nav-indicator {
            border-radius: 9999px;
            padding: 4px 16px;
            transition: background-color 0.18s cubic-bezier(0.2, 0, 0, 1), color 0.18s ease;
        }
        .nav-item-active .nav-indicator {
            background-color: var(--nav-pill);
        }

        .fade-in {
            animation: fadeIn 0.18s cubic-bezier(0.2, 0, 0, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sheet-enter {
            animation: sheetUp 0.22s cubic-bezier(0.2, 0, 0, 1);
        }
        @keyframes sheetUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input, textarea, select {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-screen">

    <!-- Top Application Header -->
    <header id="app-header" class="min-h-[3.75rem] shrink-0 bg-app-secondary border-b border-app px-4 md:px-6 flex items-center justify-between gap-2 z-20 pt-[env(safe-area-inset-top)]">
        <!-- Rendered by JS -->
    </header>

    <!-- Main Scrollable/Interactive Workspace -->
    <main id="app-main" class="flex-1 min-h-0 flex flex-col relative overflow-hidden">
        <!-- Rendered by JS -->
    </main>

    <!-- Floating Quick-Capture Action Button (Material 3 Rounded FAB) -->
    <button id="fab-capture" onclick="openQuickCaptureSheet()" aria-label="Quick Capture"
        class="fixed right-4 bottom-[calc(4.85rem+env(safe-area-inset-bottom))] md:bottom-24 z-30 w-14 h-14 rounded-2xl btn-primary shadow-md shadow-black/40 flex items-center justify-center transition-transform active:scale-95">
        <i class="ph-bold ph-plus text-2xl"></i>
    </button>

    <!-- Bottom 5-Destination Navigation Bar (Material 3 Navigation Bar) -->
    <nav id="app-nav" class="min-h-[4.35rem] shrink-0 bg-app-secondary border-t border-app px-1.5 md:px-6 flex items-center justify-around z-20 pb-[env(safe-area-inset-bottom)]">
        <!-- Rendered by JS -->
    </nav>

    <!-- Slide-Up Bottom Sheet / Dialog Container -->
    <div id="modal-backdrop" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/70 p-0 sm:p-4" onclick="handleBackdropClick(event)">
        <div id="modal-panel" class="w-full sm:max-w-lg max-h-[90dvh] bg-app-secondary border-t sm:border border-app rounded-t-[28px] sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl sheet-enter pb-[env(safe-area-inset-bottom)] sm:pb-0" onclick="event.stopPropagation()">
            <div class="w-9 h-1 rounded-full bg-app-elevated mx-auto mt-2.5 mb-0.5 sm:hidden shrink-0"></div>
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- Toast Notification (Material 3 Snackbar) -->
    <div id="toast-banner" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-app-elevated border border-app text-app-primary text-xs font-medium px-4 py-2.5 rounded-xl shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 flex items-center gap-2">
        <i class="ph-fill ph-check-circle text-[#36C88C] text-base"></i>
        <span id="toast-text">Saved</span>
    </div>

    <script>
        // =========================================================================
        // 1. TAXONOMIES, CONSTANTS & SCHEMA DEFINITIONS
        // =========================================================================
        const STORAGE_KEY = 'venture_validator_os_v1';
        const SCHEMA_VERSION = 1;

        const PIPELINE_STAGES = [
            { id: 'Captured', label: 'Captured', desc: 'Raw problem or observation', color: '#98A7B8' },
            { id: 'Defined', label: 'Defined', desc: 'Problem articulated clearly', color: '#5B93FF' },
            { id: 'Investigating', label: 'Investigating', desc: 'Customer discovery underway', color: '#F5B646' },
            { id: 'Testing', label: 'Testing', desc: 'Key assumptions being tested', color: '#A78BFA' },
            { id: 'Validated', label: 'Validated', desc: 'Evidence meets validation criteria', color: '#36C88C' },
            { id: 'Invalidated', label: 'Invalidated', desc: 'Evidence contradicts hypothesis', color: '#F16E76' }
        ];

        const HUMAN_INCENTIVES = [
            { id: 'money', label: 'Money & Financial Security', desc: 'Increasing income, protecting savings, or reducing financial waste.' },
            { id: 'time', label: 'Time & Convenience', desc: 'Saving effort, eliminating friction, or reclaiming hours.' },
            { id: 'safety', label: 'Safety & Survival', desc: 'Avoiding physical harm, loss, danger, or catastrophic failure.' },
            { id: 'freedom', label: 'Freedom & Autonomy', desc: 'Maintaining independence, flexibility, and self-direction.' },
            { id: 'status', label: 'Status & Recognition', desc: 'Earning respect, credibility, prestige, or visible competence.' },
            { id: 'belonging', label: 'Belonging & Relationships', desc: 'Fitting into a valued peer group, team, or community.' },
            { id: 'love', label: 'Love & Connection', desc: 'Deepening intimacy, trust, care, and personal bonds.' },
            { id: 'comfort', label: 'Comfort & Pleasure', desc: 'Reducing stress, sensory discomfort, or mental strain.' },
            { id: 'health', label: 'Health & Well-being', desc: 'Improving physical vitality, mental clarity, or longevity.' },
            { id: 'achievement', label: 'Achievement & Mastery', desc: 'Accomplishing difficult goals and demonstrating skill.' },
            { id: 'certainty', label: 'Certainty & Control', desc: 'Predictability, reliability, and clear visibility over outcomes.' },
            { id: 'meaning', label: 'Meaning & Fulfillment', desc: 'Contributing to a purpose larger than immediate self-interest.' }
        ];

        const EVIDENCE_TYPES = [
            { id: 'interview_note', label: 'Interview Note', weight: 1.0 },
            { id: 'direct_quote', label: 'Direct Customer Quote', weight: 1.2 },
            { id: 'observation', label: 'Direct Observation', weight: 1.5 },
            { id: 'survey_result', label: 'Survey Result', weight: 0.8 },
            { id: 'behavioral', label: 'Behavioral Evidence', weight: 1.8 },
            { id: 'experiment_result', label: 'Experiment Result', weight: 2.0 },
            { id: 'purchase_commitment', label: 'Purchase Commitment / LOI', weight: 2.5 },
            { id: 'actual_transaction', label: 'Actual Transaction / Paid Pilot', weight: 3.0 }
        ];

        const VIABILITY_DIMENSIONS = [
            { key: 'severity', label: 'Problem Severity', weightKey: 'severity', desc: 'How costly, disruptive, or painful is the problem when it occurs?' },
            { key: 'frequency', label: 'Frequency', weightKey: 'frequency', desc: 'How often does the target customer encounter this problem?' },
            { key: 'urgency', label: 'Urgency', weightKey: 'urgency', desc: 'How quickly does the customer need this resolved right now?' },
            { key: 'willingnessToPay', label: 'Willingness to Pay', weightKey: 'willingnessToPay', desc: 'Does the customer value the outcome enough to pay money for it?' },
            { key: 'abilityToPay', label: 'Ability to Pay', weightKey: 'abilityToPay', desc: 'Does the customer realistically have the budget or cash flow to pay?' },
            { key: 'reachability', label: 'Customer Reachability', weightKey: 'reachability', desc: 'Can you reliably find, contact, and acquire these customers?' },
            { key: 'marketPotential', label: 'Market Potential', weightKey: 'marketPotential', desc: 'How many plausible customers share this problem and budget?' },
            { key: 'feasibility', label: 'Solution Feasibility', weightKey: 'feasibility', desc: 'Can you realistically deliver a reliable resolution with available resources?' }
        ];

        const DEFAULT_WEIGHTS = {
            severity: 15,
            frequency: 10,
            urgency: 10,
            willingnessToPay: 20,
            abilityToPay: 15,
            reachability: 10,
            marketPotential: 10,
            feasibility: 10
        };

        const PROJECT_COLORS = ['#5B93FF', '#36C88C', '#F5B646', '#F16E76', '#A78BFA', '#38BDF8', '#98A5B5'];

        const INTERVIEW_GUIDE_PROMPTS = [
            'Tell me about the last time you experienced this problem. Walk me through what happened step by step.',
            'What were you trying to accomplish at that moment, and what got in the way?',
            'What did you do right after that happened? What workaround did you use?',
            'What did that delay, mistake, or workaround actually cost you in time, money, or stress?',
            'Have you tried buying or setting up any tools to fix this in the past 6 months? Why did or did not that work?'
        ];

        const uid = (prefix) => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
        const nowISO = () => new Date().toISOString();

        // =========================================================================
        // 2. NORMALIZED RELATIONAL DATA STORE & DEFENSIVE PERSISTENCE
        // =========================================================================
        function createEmptyState() {
            return {
                schemaVersion: SCHEMA_VERSION,
                theme: 'dark',
                onboardingCompleted: false,
                workspaceName: 'Founder Workspace',
                scoringWeights: { ...DEFAULT_WEIGHTS },
                customIncentives: [],
                projects: [],
                people: [],
                problems: [],
                evidence: [],
                interviews: [],
                experiments: [],
                opportunities: [],
                activityLog: []
            };
        }

        function sanitizeLoadedData(raw) {
            const base = createEmptyState();
            if (!raw || typeof raw !== 'object') return base;

            const safe = {
                ...base,
                schemaVersion: typeof raw.schemaVersion === 'number' ? raw.schemaVersion : SCHEMA_VERSION,
                theme: raw.theme === 'light' ? 'light' : 'dark',
                onboardingCompleted: Boolean(raw.onboardingCompleted),
                workspaceName: typeof raw.workspaceName === 'string' && raw.workspaceName.trim() ? raw.workspaceName.trim() : 'Founder Workspace',
                scoringWeights: { ...DEFAULT_WEIGHTS, ...(raw.scoringWeights || {}) },
                customIncentives: Array.isArray(raw.customIncentives) ? raw.customIncentives : [],
                projects: Array.isArray(raw.projects) ? raw.projects : [],
                people: Array.isArray(raw.people) ? raw.people : [],
                problems: Array.isArray(raw.problems) ? raw.problems : [],
                evidence: Array.isArray(raw.evidence) ? raw.evidence : [],
                interviews: Array.isArray(raw.interviews) ? raw.interviews : [],
                experiments: Array.isArray(raw.experiments) ? raw.experiments : [],
                opportunities: Array.isArray(raw.opportunities) ? raw.opportunities : [],
                activityLog: Array.isArray(raw.activityLog) ? raw.activityLog : []
            };

            safe.problems = safe.problems.map(p => ({
                id: p.id || uid('prob'),
                projectId: p.projectId || '',
                personIds: Array.isArray(p.personIds) ? p.personIds : [],
                stage: PIPELINE_STAGES.some(s => s.id === p.stage) ? p.stage : 'Captured',
                title: p.title || 'Untitled Problem',
                description: p.description || '',
                whoExperiences: p.whoExperiences || '',
                context: p.context || '',
                frequencyText: p.frequencyText || '',
                consequence: p.consequence || '',
                supportingObservation: p.supportingObservation || '',
                problemStatement: p.problemStatement || '',
                problemStatementEdited: Boolean(p.problemStatementEdited),
                rootCause: {
                    fiveWhys: Array.isArray(p.rootCause?.fiveWhys) ? p.rootCause.fiveWhys : ['', '', '', '', ''],
                    hypotheses: p.rootCause?.hypotheses || '',
                    contributingFactors: p.rootCause?.contributingFactors || '',
                    causeEvidence: p.rootCause?.causeEvidence || '',
                    alternativeExplanations: p.rootCause?.alternativeExplanations || ''
                },
                desiredOutcome: {
                    whatTheyWant: p.desiredOutcome?.whatTheyWant || '',
                    successCriteria: p.desiredOutcome?.successCriteria || '',
                    currentWorkaround: p.desiredOutcome?.currentWorkaround || '',
                    costOfInaction: p.desiredOutcome?.costOfInaction || ''
                },
                incentives: Array.isArray(p.incentives) ? p.incentives : [],
                alternatives: {
                    existingSolutions: p.alternatives?.existingSolutions || '',
                    workarounds: p.alternatives?.workarounds || '',
                    competitors: p.alternatives?.competitors || '',
                    currentCost: p.alternatives?.currentCost || '',
                    dissatisfaction: p.alternatives?.dissatisfaction || '',
                    switchingBarriers: p.alternatives?.switchingBarriers || ''
                },
                viability: normalizeViability(p.viability),
                regulatory: {
                    level: p.regulatory?.level || 'Unknown',
                    notes: p.regulatory?.notes || '',
                    assumptions: p.regulatory?.assumptions || ''
                },
                coachAnswers: typeof p.coachAnswers === 'object' && p.coachAnswers ? p.coachAnswers : {},
                createdAt: p.createdAt || nowISO(),
                updatedAt: p.updatedAt || nowISO()
            }));

            safe.people = safe.people.map(person => ({
                id: person.id || uid('pers'),
                projectId: person.projectId || '',
                name: person.name || 'Unnamed Segment',
                type: person.type === 'Individual' ? 'Individual' : 'Segment',
                description: person.description || '',
                contexts: Array.isArray(person.contexts) ? person.contexts : [],
                desiredOutcomes: Array.isArray(person.desiredOutcomes) ? person.desiredOutcomes : [],
                motivations: Array.isArray(person.motivations) ? person.motivations : [],
                incentives: Array.isArray(person.incentives) ? person.incentives : [],
                commercialNotes: person.commercialNotes || '',
                createdAt: person.createdAt || nowISO(),
                updatedAt: person.updatedAt || nowISO()
            }));

            return safe;
        }

        function normalizeViability(v) {
            const out = {};
            VIABILITY_DIMENSIONS.forEach(dim => {
                const existing = v && v[dim.key] ? v[dim.key] : {};
                out[dim.key] = {
                    score: typeof existing.score === 'number' ? existing.score : null,
                    evidence: existing.evidence || '',
                    assumptions: existing.assumptions || '',
                    confidence: existing.confidence || 'Low'
                };
            });
            return out;
        }

        let db = (() => {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return createEmptyState();
                return sanitizeLoadedData(JSON.parse(raw));
            } catch (err) {
                console.error('Storage parse failure:', err);
                return createEmptyState();
            }
        })();

        let nav = {
            tab: 'dashboard',
            problemId: null,
            problemSubTab: 'definition',
            personId: null,
            opportunityId: null,
            projectId: null,
            compareIds: [],
            showArchivedProjects: false,
            pipelineFiltersOpen: false,
            pipelineFilters: {
                search: '',
                projectId: '',
                stage: '',
                incentive: '',
                minSeverity: '',
                evidenceStrength: '',
                minCommercial: '',
                sortBy: 'updated'
            },
            peopleSearch: '',
            peopleProjectFilter: '',
            oppSearch: '',
            oppSort: 'score',
            globalSearchQuery: ''
        };

        function persist(actionSummary = null) {
            if (actionSummary) {
                db.activityLog.unshift({
                    id: uid('act'),
                    text: actionSummary,
                    timestamp: nowISO()
                });
                if (db.activityLog.length > 40) db.activityLog.length = 40;
            }
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            } catch (err) {
                console.error('Failed to persist to localStorage:', err);
                showToast('Storage warning: unable to save locally');
            }
        }

        function applyTheme() {
            const html = document.documentElement;
            if (db.theme === 'light') {
                html.classList.remove('dark');
                html.classList.add('light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
            }
        }

        function esc(val) {
            if (val === null || val === undefined) return '';
            return String(val)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatRelativeDate(iso) {
            if (!iso) return 'Just now';
            const diffMs = Date.now() - new Date(iso).getTime();
            const mins = Math.floor(diffMs / 60000);
            if (mins < 1) return 'Just now';
            if (mins < 60) return `${mins}m ago`;
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return `${hrs}h ago`;
            const days = Math.floor(hrs / 24);
            if (days < 7) return `${days}d ago`;
            return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        let toastTimeout = null;
        function showToast(msg) {
            const el = document.getElementById('toast-banner');
            const txt = document.getElementById('toast-text');
            if (!el || !txt) return;
            txt.textContent = msg;
            el.classList.remove('opacity-0');
            el.classList.add('opacity-100');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                el.classList.remove('opacity-100');
                el.classList.add('opacity-0');
            }, 2200);
        }

        // =========================================================================
        // 3. EVIDENCE-AWARE VALIDATION SCORING ENGINE
        // =========================================================================
        function evaluateProblemScore(problem) {
            const weights = db.scoringWeights || DEFAULT_WEIGHTS;

            let weightedSum = 0;
            let ratedWeight = 0;
            const missingDimensions = [];
            const ratedList = [];

            VIABILITY_DIMENSIONS.forEach(dim => {
                const entry = problem.viability?.[dim.key];
                const w = Number(weights[dim.weightKey] || 0);
                if (entry && typeof entry.score === 'number') {
                    weightedSum += (entry.score / 5) * w;
                    ratedWeight += w;
                    ratedList.push({
                        key: dim.key,
                        label: dim.label,
                        score: entry.score,
                        confidence: entry.confidence || 'Low',
                        hasEvidence: Boolean(entry.evidence && entry.evidence.trim()),
                        hasAssumptions: Boolean(entry.assumptions && entry.assumptions.trim())
                    });
                } else {
                    missingDimensions.push(dim.label);
                }
            });

            const isComplete = missingDimensions.length === 0;
            const normalizedScore = ratedWeight > 0 ? Math.round((weightedSum / ratedWeight) * 100) : null;
            const completenessPct = Math.round(((VIABILITY_DIMENSIONS.length - missingDimensions.length) / VIABILITY_DIMENSIONS.length) * 100);

            const linkedEvidence = db.evidence.filter(e => e.problemId === problem.id);
            const linkedInterviews = db.interviews.filter(i => i.problemId === problem.id);
            const linkedExperiments = db.experiments.filter(ex => ex.problemId === problem.id);

            let evidencePoints = 0;
            linkedEvidence.forEach(ev => {
                const meta = EVIDENCE_TYPES.find(t => t.id === ev.type);
                evidencePoints += meta ? meta.weight : 1;
            });
            evidencePoints += linkedInterviews.length * 1.2;
            evidencePoints += linkedExperiments.filter(ex => ex.result && ex.result.trim()).length * 1.5;

            const highConfDimensions = ratedList.filter(r => r.confidence === 'High' && r.hasEvidence).length;
            evidencePoints += highConfDimensions * 0.8;

            let confidenceLabel = 'Unverified (Assumptions Only)';
            let confidencePct = 0;
            let confidenceColor = '#F16E76';

            if (evidencePoints >= 10) {
                confidenceLabel = 'Strong Evidence';
                confidencePct = Math.min(100, Math.round((evidencePoints / 14) * 100));
                confidenceColor = '#36C88C';
            } else if (evidencePoints >= 4) {
                confidenceLabel = 'Moderate Evidence';
                confidencePct = Math.round((evidencePoints / 14) * 100);
                confidenceColor = '#F5B646';
            } else if (evidencePoints > 0) {
                confidenceLabel = 'Early Signal';
                confidencePct = Math.max(12, Math.round((evidencePoints / 14) * 100));
                confidenceColor = '#5B93FF';
            }

            const strongest = ratedList
                .filter(r => r.score >= 4)
                .sort((a, b) => b.score - a.score)
                .slice(0, 3);

            const weakestAssumptions = ratedList
                .filter(r => (r.score >= 3 && (!r.hasEvidence || r.confidence === 'Low')) || r.score <= 2)
                .slice(0, 3);

            let unansweredQuestion = 'Have real customers demonstrated willingness to pay with time or money?';
            let nextAction = 'Conduct 3 past-behavior customer discovery interviews.';

            if (!problem.whoExperiences.trim() && problem.personIds.length === 0) {
                unansweredQuestion = 'Who specifically experiences this problem most acutely?';
                nextAction = 'Define the target customer segment in Problem Definition.';
            } else if (!problem.context.trim() || !problem.consequence.trim()) {
                unansweredQuestion = 'Under what exact circumstances does this occur and what does it cost them?';
                nextAction = 'Complete the Context and Consequence fields in Problem Definition.';
            } else if (linkedEvidence.length === 0 && linkedInterviews.length === 0) {
                unansweredQuestion = 'Is this problem real in customer behavior, or still a founder assumption?';
                nextAction = 'Log at least 2 real-world observations or customer interview notes.';
            } else if (problem.viability?.willingnessToPay?.score === null) {
                unansweredQuestion = 'Will customers pay to solve this, or merely complain about it?';
                nextAction = 'Evaluate Willingness to Pay and Ability to Pay in Commercial Viability.';
            } else if (problem.viability?.willingnessToPay?.confidence === 'Low') {
                unansweredQuestion = 'What behavioral proof validates your Willingness to Pay rating?';
                nextAction = 'Design a lightweight commitment or concierge experiment.';
            } else if (missingDimensions.length > 0) {
                unansweredQuestion = `How does this problem rate on ${missingDimensions[0]}?`;
                nextAction = `Complete the remaining ${missingDimensions.length} viability rating(s).`;
            } else {
                unansweredQuestion = 'What is the riskiest remaining assumption before committing build resources?';
                nextAction = 'Run a validation experiment or compare in Opportunity Explorer.';
            }

            return {
                isComplete,
                normalizedScore,
                completenessPct,
                missingDimensions,
                confidenceLabel,
                confidencePct,
                confidenceColor,
                evidenceCount: linkedEvidence.length,
                interviewCount: linkedInterviews.length,
                experimentCount: linkedExperiments.length,
                strongest,
                weakestAssumptions,
                unansweredQuestion,
                nextAction,
                regulatoryLevel: problem.regulatory?.level || 'Unknown'
            };
        }

        function generateProblemStatement(p) {
            const who = (p.whoExperiences || '').trim() || (p.personIds[0] ? db.people.find(x => x.id === p.personIds[0])?.name : '') || '[specific audience]';
            const ctx = (p.context || '').trim() || '[specific context]';
            const prob = (p.title || '').trim() || '[problem]';
            const cons = (p.consequence || '').trim() || '[measurable consequence]';
            return `When ${who} experiences ${ctx}, they struggle with ${prob}, resulting in ${cons}.`;
        }

        function createProblemRecord(fields = {}) {
            const p = {
                id: fields.id || uid('prob'),
                projectId: fields.projectId || '',
                personIds: Array.isArray(fields.personIds) ? fields.personIds : [],
                stage: fields.stage || 'Captured',
                title: fields.title || 'Untitled Problem',
                description: fields.description || '',
                whoExperiences: fields.whoExperiences || '',
                context: fields.context || '',
                frequencyText: fields.frequencyText || '',
                consequence: fields.consequence || '',
                supportingObservation: fields.supportingObservation || '',
                problemStatement: fields.problemStatement || '',
                problemStatementEdited: Boolean(fields.problemStatementEdited),
                rootCause: {
                    fiveWhys: ['', '', '', '', ''],
                    hypotheses: '',
                    contributingFactors: '',
                    causeEvidence: '',
                    alternativeExplanations: '',
                    ...(fields.rootCause || {})
                },
                desiredOutcome: {
                    whatTheyWant: '',
                    successCriteria: '',
                    currentWorkaround: '',
                    costOfInaction: '',
                    ...(fields.desiredOutcome || {})
                },
                incentives: Array.isArray(fields.incentives) ? fields.incentives : [],
                alternatives: {
                    existingSolutions: '',
                    workarounds: '',
                    competitors: '',
                    currentCost: '',
                    dissatisfaction: '',
                    switchingBarriers: '',
                    ...(fields.alternatives || {})
                },
                viability: normalizeViability(fields.viability),
                regulatory: {
                    level: 'Unknown',
                    notes: '',
                    assumptions: '',
                    ...(fields.regulatory || {})
                },
                coachAnswers: fields.coachAnswers || {},
                createdAt: nowISO(),
                updatedAt: nowISO()
            };
            if (!p.problemStatement) {
                p.problemStatement = generateProblemStatement(p);
            }
            db.problems.unshift(p);
            return p;
        }

        function createPersonRecord(fields = {}) {
            const person = {

                name: fields.name || 'Unnamed Segment',
                type: fields.type === 'Individual' ? 'Individual' : 'Segment',

        function submitQuickProblem(e) {
            e.preventDefault();
            const title = document.getElementById('qc-prob-title')?.value.trim();
            if (!title) return;

            const who = document.getElementById('qc-prob-who')?.value.trim() || '';
            const projectId = document.getElementById('qc-prob-project')?.value || '';
            const context = document.getElementById('qc-prob-context')?.value.trim() || '';
            const freq = document.getElementById('qc-prob-freq')?.value.trim() || '';
            const sevRaw = document.getElementById('qc-prob-sev')?.value;
            const alt = document.getElementById('qc-prob-alt')?.value.trim() || '';
            const obs = document.getElementById('qc-prob-obs')?.value.trim() || '';
            const submitAction = e.submitter?.value || 'save';

            const personIds = [];
            if (who) {
                let matched = db.people.find(p => p.name.toLowerCase() === who.toLowerCase());
                if (!matched) {
                    matched = createPersonRecord({
                        name: who,
                        projectId,
                        contexts: context ? [context] : []
                    });
                }
                personIds.push(matched.id);
            }

            const viability = normalizeViability({});
            if (sevRaw !== '') {
                viability.severity.score = Number(sevRaw);
            }

            const prob = createProblemRecord({
                title,
                whoExperiences: who,
                projectId,
                personIds,
                context,
                frequencyText: freq,
                supportingObservation: obs,
                alternatives: { existingSolutions: alt },
                viability
            });

            if (obs) {
                db.evidence.unshift({
                    id: uid('ev'),
                    problemId: prob.id,
                    projectId,
                    source: 'Initial Capture Note',
                    date: new Date().toISOString().slice(0, 10),
                    type: 'observation',
                    observation: obs,
                    interpretation: '',
                    hypothesis: title,
                    reliability: 'Founder field note'
                });
            }

            persist(`Captured problem "${prob.title}"`);
            closeModal();
            showToast('Problem captured');

            if (submitAction === 'open') {
                openProblemDetail(prob.id, 'definition');
            } else {
                renderApp();
            }
        }

        function getFilteredPipelineProblems() {
            const f = nav.pipelineFilters;
            let list = [...db.problems];

            if (f.search.trim()) {
                const q = f.search.toLowerCase();
                list = list.filter(p =>
                    p.title.toLowerCase().includes(q) ||
                    p.description.toLowerCase().includes(q) ||
                    p.whoExperiences.toLowerCase().includes(q) ||
                    p.context.toLowerCase().includes(q)
                );
            }
            if (f.projectId) {
                list = list.filter(p => p.projectId === f.projectId);
            }
            if (f.stage) {
                list = list.filter(p => p.stage === f.stage);
            }
            if (f.incentive) {
                list = list.filter(p => p.incentives.includes(f.incentive));
            }
            if (f.minSeverity !== '') {
                const minS = Number(f.minSeverity);
                list = list.filter(p => (p.viability?.severity?.score ?? -1) >= minS);
            }
            if (f.evidenceStrength) {
                list = list.filter(p => {
                    const ev = evaluateProblemScore(p);
                    if (f.evidenceStrength === 'strong') return ev.confidenceLabel === 'Strong Evidence';
                    if (f.evidenceStrength === 'moderate') return ev.confidenceLabel === 'Moderate Evidence';
                    if (f.evidenceStrength === 'early') return ev.confidenceLabel === 'Early Signal';
                    if (f.evidenceStrength === 'none') return ev.evidenceCount === 0;
                    return true;
                });
            }
            if (f.minCommercial !== '') {
                const minC = Number(f.minCommercial);
                list = list.filter(p => {
                    const sc = evaluateProblemScore(p).normalizedScore;
                    return sc !== null && sc >= minC;
                });
            }

            list.sort((a, b) => {
                if (f.sortBy === 'alpha') return a.title.localeCompare(b.title);
                if (f.sortBy === 'severity') return (b.viability?.severity?.score ?? -1) - (a.viability?.severity?.score ?? -1);
                if (f.sortBy === 'score') return (evaluateProblemScore(b).normalizedScore ?? -1) - (evaluateProblemScore(a).normalizedScore ?? -1);
                if (f.sortBy === 'confidence') return evaluateProblemScore(b).confidencePct - evaluateProblemScore(a).confidencePct;
                return new Date(b.updatedAt) - new Date(a.updatedAt);
            });

            return list;
        }

                                <select onchange="updatePipelineFilter('evidenceStrength', this.value)" class="rounded-xl px-2.5 py-2 text-xs">

                                    <option value="none" ${f.evidenceStrength === 'none' ? 'selected' : ''}>No Evidence Yet</option>

                                    <option value="50" ${f.minCommercial === '50' ? 'selected' : ''}>Score ≥ 50</option>

        function renderKanbanCard(p) {

                    <h3 class="text-sm font-bold text-app-primary leading-snug">${esc(p.title)}</h3>

                    ${p.description ? `
                        <p class="text-xs text-app-secondary line-clamp-2 leading-relaxed">${esc(p.description)}</p>
                    ` : ''}

                    <div class="flex flex-wrap items-center gap-1.5">

        function updatePipelineFilter(key, value) {

        function resetPipelineFilters() {
            nav.pipelineFilters = {
                search: '',
                projectId: '',
                stage: '',
                incentive: '',
                minSeverity: '',
                evidenceStrength: '',
                minCommercial: '',
                sortBy: 'updated'
            };
            renderApp();
        }

        function handleKanbanDrop(e, targetStage) {
            e.preventDefault();
            const problemId = e.dataTransfer.getData('text/plain');
            if (problemId) changeProblemStage(problemId, targetStage);
        }

        function changeProblemStage(problemId, newStage) {
            const p = db.problems.find(x => x.id === problemId);
            if (!p || p.stage === newStage) return;
            p.stage = newStage;
            p.updatedAt = nowISO();
            persist(`Moved "${p.title}" to ${newStage}`);
            showToast(`Stage: ${newStage}`);
            renderApp();
        }

                            <form onsubmit="addProblemFromPersonFlow(event, '${person.id}')" class="flex gap-2 pt-1">

                        <div class="flex justify-center text-app-secondary"><i class="ph-bold ph-arrow-down"></i></div>

                            <div>
                                <span class="text-[11px] font-bold uppercase tracking-wider text-[#A78BFA]">5. MOTIVATIONS — Why It Matters</span>
                                <p class="text-xs text-app-secondary mt-0.5">Why does achieving this outcome matter deeply to them?</p>
                            </div>
                            <div class="space-y-2">
                                ${person.motivations.map((mot, idx) => `
                                    <div class="flex items-center gap-2 bg-app-primary border border-app rounded-xl px-3 py-2">
                                        <span class="text-xs text-app-primary flex-1">${esc(mot)}</span>
                                        <button onclick="removePersonListItem('${person.id}', 'motivations', ${idx})" class="text-app-secondary hover:text-[#F16E76] p-1"><i class="ph ph-x"></i></button>
                                    </div>
                                `).join('')}
                            </div>
                            <form onsubmit="addPersonListItem(event, '${person.id}', 'motivations', 'mot-input')" class="flex gap-2">
                                <input type="text" id="mot-input" placeholder="Add an underlying motivation..." class="flex-1 rounded-xl px-3 py-2.5 text-xs">
                                <button type="submit" class="btn-primary px-3.5 py-2.5 rounded-xl text-xs font-semibold shrink-0">Add</button>
                            </form>
                        </section>

                        <div class="flex justify-center text-app-secondary"><i class="ph-bold ph-arrow-down"></i></div>

                        <section class="bg-app-card border border-app rounded-2xl p-4 md:p-5 space-y-3">
                            <div>
                                <span class="text-[11px] font-bold uppercase tracking-wider text-[#5B93FF]">6. HUMAN INCENTIVES</span>
                                <p class="text-xs text-app-secondary mt-0.5">Select all fundamental incentives driving their behavior.</p>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${allIncentives.map(inc => {
                                    const active = person.incentives.includes(inc.id);
                                    return `
                                        <button type="button" onclick="togglePersonIncentive('${person.id}', '${inc.id}')"
                                            class="px-3 py-2 rounded-xl text-xs font-medium border transition-colors ${active ? 'border-[#5B93FF] bg-[#5B93FF]/15 text-app-primary' : 'border-app bg-app-primary text-app-secondary hover:text-app-primary'}">
                                            ${active ? '✓ ' : ''}${esc(inc.label)}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </section>

                        <div class="flex justify-center text-app-secondary"><i class="ph-bold ph-arrow-down"></i></div>

                        <section class="bg-app-card border border-app rounded-2xl p-4 md:p-5 space-y-3">
                            <div>
                                <span class="text-[11px] font-bold uppercase tracking-wider text-[#36C88C]">7. COMMERCIAL VIABILITY</span>
                                <p class="text-xs text-app-secondary mt-0.5">Would they pay to remove the obstacle or achieve the outcome? What budget do they control?</p>
                            </div>
                            <textarea rows="3" onchange="updatePersonField('${person.id}', 'commercialNotes', this.value)"
                                placeholder="Document budget authority, current spend on workarounds, and willingness/ability to pay..."
                                class="w-full rounded-xl p-3 text-xs">${esc(person.commercialNotes)}</textarea>
                        </section>
                    </div>
                </div>
            `;
        }

        function updatePersonField(personId, field, value) {
            const p = db.people.find(x => x.id === personId);
            if (!p) return;
            p[field] = value;
            p.updatedAt = nowISO();
            persist();
            if (field === 'name') renderHeader();
        }

        function addPersonListItem(e, personId, field, inputId) {
            e.preventDefault();
            const input = document.getElementById(inputId);
            const val = input?.value.trim();
            if (!val) return;
            const p = db.people.find(x => x.id === personId);
            if (!p) return;
            p[field].push(val);
            p.updatedAt = nowISO();
            persist(`Updated ${field} for "${p.name}"`);
            renderApp();
        }

        function removePersonListItem(personId, field, idx) {
            const p = db.people.find(x => x.id === personId);
            if (!p) return;
            p[field].splice(idx, 1);
            p.updatedAt = nowISO();
            persist();
            renderApp();
        }

        function togglePersonIncentive(personId, incId) {
            const p = db.people.find(x => x.id === personId);
            if (!p) return;
            const idx = p.incentives.indexOf(incId);
            if (idx > -1) p.incentives.splice(idx, 1);
            else p.incentives.push(incId);
            p.updatedAt = nowISO();
            persist();
            renderApp();
        }

        function addProblemFromPersonFlow(e, personId) {
            e.preventDefault();
            const input = document.getElementById('person-prob-input');
            const title = input?.value.trim();
            if (!title) return;
            const person = db.people.find(p => p.id === personId);
            if (!person) return;

            const prob = createProblemRecord({
                title,
                projectId: person.projectId || '',
                personIds: [person.id],
                whoExperiences: person.name,
                context: person.contexts[0] || '',
                incentives: [...person.incentives],
                desiredOutcome: {
                    whatTheyWant: person.desiredOutcomes[0] || ''
                }
            });
            person.updatedAt = nowISO();
            persist(`Linked problem "${prob.title}" to "${person.name}"`);
            showToast('Added to Pipeline');
            renderApp();
        }

        function confirmDeletePerson(personId) {
            const person = db.people.find(p => p.id === personId);
            if (!person) return;
            openConfirmDialog({
                title: 'Delete Person Record?',
                message: `Delete "${person.name}"? Linked problems in your pipeline will remain intact.`,
                confirmLabel: 'Delete',
                danger: true,
                onConfirm: () => {
                    db.people = db.people.filter(p => p.id !== personId);
                    db.problems.forEach(pr => {
                        pr.personIds = pr.personIds.filter(id => id !== personId);
                    });
                    persist(`Deleted person "${person.name}"`);
                    switchTab('people');
                    showToast('Person deleted');
                }
            });
        }

        // =========================================================================
        // 11. SCREEN 4: PROBLEM VALIDATION WORKSPACE
        // =========================================================================
        function renderProblemWorkspace() {
            const p = db.problems.find(x => x.id === nav.problemId);
            if (!p) {
                switchTab('pipeline');
                return '';
            }

            const evalRes = evaluateProblemScore(p);
            const subTabs = [
                { id: 'definition', label: 'A. Definition' },
                { id: 'root', label: 'B. Root Cause' },
                { id: 'outcome', label: 'C. Outcome' },
                { id: 'incentives', label: 'D. Incentives' },
                { id: 'alternatives', label: 'E. Alternatives' },
                { id: 'evidence', label: `F. Evidence (${evalRes.evidenceCount})` },
                { id: 'viability', label: 'G. Viability & Score' },
                { id: 'coach', label: 'Guided Coach' },
                { id: 'interviews', label: `Interviews (${evalRes.interviewCount})` },
                { id: 'experiments', label: `Experiments (${evalRes.experimentCount})` }
            ];

            return `
                <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
                    <div class="shrink-0 bg-app-secondary border-b border-app px-4 md:px-6 pt-3 space-y-2.5">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div class="flex items-center gap-2 flex-wrap">
                                <select onchange="changeProblemStage('${p.id}', this.value)" class="rounded-xl px-2.5 py-1.5 text-xs font-semibold">
                                    ${PIPELINE_STAGES.map(st => `<option value="${st.id}" ${p.stage === st.id ? 'selected' : ''}>Stage: ${st.label}</option>`).join('')}
                                </select>
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-xl bg-app-elevated" style="color:${evalRes.confidenceColor};">
                                    ${esc(evalRes.confidenceLabel)}
                                </span>
                                <span class="text-xs font-bold px-2.5 py-1 rounded-xl bg-[#5B93FF]/15 text-[#5B93FF]">
                                    Score: ${evalRes.normalizedScore !== null ? `${evalRes.normalizedScore}/100${evalRes.isComplete ? '' : ' (Provisional)'}` : 'Incomplete'}
                                </span>
                            </div>

                            <div class="flex items-center gap-2">
                                <button onclick="promoteProblemToOpportunity('${p.id}')" class="bg-[#36C88C]/15 hover:bg-[#36C88C]/25 text-[#36C88C] border border-[#36C88C]/30 px-3 py-1.5 rounded-xl text-xs font-semibold">
                                    + Opportunity
                                </button>
                                <button onclick="confirmDeleteProblem('${p.id}')" class="text-app-secondary hover:text-[#F16E76] p-1.5 rounded-xl" title="Delete Problem">
                                    <i class="ph ph-trash text-base"></i>
                                </button>
                            </div>
                        </div>

                        <div class="flex items-center gap-1.5 scroll-x no-scrollbar pb-2.5">
                            ${subTabs.map(t => {
                                const active = nav.problemSubTab === t.id;
                                return `
                                    <button onclick="nav.problemSubTab = '${t.id}'; renderApp();"
                                        class="shrink-0 px-3 py-2 rounded-xl text-xs font-semibold transition-colors ${active ? 'btn-primary' : 'bg-app-card border border-app text-app-secondary hover:text-app-primary'}">
                                        ${esc(t.label)}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="flex-1 scroll-y p-4 md:p-6 pb-24">
                        <div class="max-w-3xl mx-auto space-y-5 fade-in">
                            ${renderProblemSubSection(p, evalRes)}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProblemSubSection(p, evalRes) {
            const tab = nav.problemSubTab;

            if (tab === 'definition') {
                const activeProjects = db.projects.filter(pr => !pr.archived);
                const generated = generateProblemStatement(p);
                return `
                    <div class="bg-app-card border border-app rounded-2xl p-4 md:p-5 space-y-4">

                            <h2 class="text-base font-bold text-app-primary">Section A — Problem Definition</h2>

                        <div>
                            <label class="block text-xs font-semibold text-app-secondary mb-1">What is happening? (Problem Title)</label>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-app-secondary mb-1">Who experiences it?</label>

                            <div>

                                </select>

                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-app-secondary mb-1">Under what circumstances? (Context)</label>
                                <input type="text" value="${esc(p.context)}" onchange="updateProblemField('${p.id}', 'context', this.value)"
                                    placeholder="Triggering event, time, or workflow..." class="w-full rounded-xl px-3 py-2.5 text-xs">

                            <div>
                                <label class="block text-xs font-semibold text-app-secondary mb-1">How frequently does it occur?</label>

                            <textarea rows="2" onchange="updateProblemField('${p.id}', 'consequence', this.value)"
                                placeholder="Time lost, money wasted, compliance risk, missed revenue..." class="w-full rounded-xl p-3 text-xs">${esc(p.consequence)}</textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-app-secondary mb-1">What initial evidence supports this claim?</label>
                            <textarea rows="2" onchange="updateProblemField('${p.id}', 'supportingObservation', this.value)"
                                placeholder="Direct observations or conversations..." class="w-full rounded-xl p-3 text-xs">${esc(p.supportingObservation)}</textarea>
                        </div>

                        <div class="bg-app-primary border border-app rounded-xl p-4 space-y-2">
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-xs font-bold text-[#5B93FF]">Structured Problem Statement</span>
                                <button type="button" onclick="regenerateProblemStatement('${p.id}')" class="text-[11px] font-semibold text-app-secondary hover:text-app-primary">
                                    Regenerate from Fields
                                </button>
                            </div>
                            <textarea rows="3" onchange="updateProblemStatementManual('${p.id}', this.value)" class="w-full rounded-lg p-2.5 text-xs leading-relaxed">${esc(p.problemStatement || generated)}</textarea>

                        <div class="pt-2 border-t border-app space-y-2">
                            <label class="block text-xs font-semibold text-app-secondary">Linked People / Customer Segments</label>
                            <div class="flex flex-wrap gap-2">

                                    return `
                                        <button type="button" onclick="toggleProblemPersonLink('${p.id}', '${pers.id}')"

                                        </button>

                            </div>

                    </div>

            }

            if (tab === 'root') {
                return `
                    <div class="bg-app-card border border-app rounded-2xl p-4 md:p-5 space-y-4">
                        <div>
                            <h2 class="text-base font-bold text-app-primary">Section B — Root Cause Analysis</h2>
                            <p class="text-xs text-app-secondary">Probe beneath surface symptoms. Treat the fifth answer as a hypothesis to verify—not automatic truth.</p>

                        <div class="space-y-2.5">
                            <div class="text-xs font-bold text-app-primary">Five Whys Investigation</div>

                                <div>

            if (tab === 'outcome') {

                    <div class="bg-app-card border border-app rounded-2xl p-4 md:p-5 space-y-4">

                            <h2 class="text-base font-bold text-app-primary">Section C — Desired Outcome</h2>

                        <div>
                            <label class="block text-xs font-semibold text-app-secondary mb-1">What does successful resolution look like? (Measurable)</label>
                            <textarea rows="2" onchange="updateNestedProblem('${p.id}', 'desiredOutcome', 'successCriteria', this.value)"

                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-app-secondary mb-1">What do they currently do instead?</label>
                            <textarea rows="2" onchange="updateNestedProblem('${p.id}', 'desiredOutcome', 'currentWorkaround', this.value)"

                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-app-secondary mb-1">What happens if the problem remains unresolved?</label>
                            <textarea rows="2" onchange="updateNestedProblem('${p.id}', 'desiredOutcome', 'costOfInaction', this.value)"

            if (tab === 'incentives') {
                const allInc = getAllIncentives();
                return `
                    <div class="bg-app-card border border-app rounded-2xl p-4 md:p-5 space-y-4">

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
